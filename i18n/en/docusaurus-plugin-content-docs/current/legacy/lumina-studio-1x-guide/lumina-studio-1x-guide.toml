origin = '''
## 高级设置
'''
translate = '''
'''

[[block]]
key = "6779fa84d45fc4dd"
type = "paragraph"
origin = '''
**色彩细节：代表使用颜色数量的参数，但实际生成会量化颜色，不代表一定准确是细节值，但建议使用64以内，复杂的图在32-64之间足够了
抠图：能用，但不建议用，容易抠多了
清理杂色：可以去掉一些独立像素，避免过多杂色
独立背板，可以把背板独立一个对象，可单独修改背板颜色或者删掉**
'''
translate = '''
'''

