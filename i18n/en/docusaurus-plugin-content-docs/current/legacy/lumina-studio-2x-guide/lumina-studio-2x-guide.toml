key = "11c23b0bb03cc2a6"
type = "heading"
origin = '''
#### 4.底板厚度
'''
translate = '''
'''

[[block]]
key = "5bb10e70d5475e9d"
type = "paragraph"
origin = '''
**底板厚度**：修改非颜色层的厚度
'''
translate = '''
'''

[[block]]
key = "1e06b7925f2d2eec"
type = "heading"
origin = '''
#### 5.单双面设置
'''
translate = '''
'''

[[block]]
key = "1118ae53a20dc810"
type = "paragraph"
origin = '''
**双面**：顶面和底面都有颜色层
**单面**：只有底面生成颜色层
'''
translate = '''
'''

[[block]]
key = "f21f40cda699b064"
type = "heading"
origin = '''
#### 6.生成模式
'''
translate = '''
'''

[[block]]
key = "cfa4bc7bb6badaf9"
type = "paragraph"
origin = '''
**高保真**：原图高清复刻 不做任何处理直接转换图片的像素（水密无缝模型），最通用标准模式，但由于这种模式非常考验图本身的干净程度，在使用过程中不可避免的会出现杂色和问题。
'''
translate = '''
'''

[[block]]
key = "6b3714f7763a600c"
type = "paragraph"
origin = '''
**像素**：体素像素直接转换，适合体素像素图。
'''
translate = '''
'''

[[block]]
key = "db6c9e51e8b3041d"
type = "paragraph"
origin = '''
**矢量**：兼容svg矢量图，更清晰的边缘，杂色更少。
'''
translate = '''
'''

[[block]]
key = "63f577bc3cb687e6"
type = "paragraph"
origin = '''
**验证色卡**：用于梯度卡准度测试用
'''
translate = '''
'''

[[block]]
key = "343d235f4b6dce50"
type = "heading"
origin = '''
#### 7.量化颜色数
'''
translate = '''
'''

[[block]]
key = "cfc8704fd25d47a6"
type = "paragraph"
origin = '''
**量化颜色数**：数量越多量化颜色越多，容易出现的杂色越多
'''
translate = '''
'''

[[block]]
key = "054e4b37c287be69"
type = "heading"
origin = '''
#### 8.生成预览
'''
translate = '''
'''

[[block]]
key = "7cfdad2df240e720"
type = "paragraph"
origin = '''
点击预览可以先预览结果，针对预览进行微调
生成是直接生成
'''
translate = '''
'''

[[block]]
key = "1f96d68977962bfd"
type = "heading"
origin = '''
#### 9.其他功能区
'''
translate = '''
'''

[[block]]
key = "d6faca74274a9912"
type = "paragraph"
origin = '''
**孤立像素清理**:将色彩匹配后与 8 邻域完全不同的孤立像素替换为邻域众数邻居的对应值，不会造调色板外的新颜色。高保真模式下的 LUT 匹配、预测匹配与耗材档案路径均会应用此清理。
'''
translate = '''
'''

[[block]]
key = "aae8384b86483c98"
type = "paragraph"
origin = '''
**分离底板**:将底板层（通常是白色或背景色）作为独立颜色层输出，适用于需要单独处理底板的打印机或后处理流程。
'''
translate = '''
'''

[[block]]
key = "209307a06ca2c089"
type = "paragraph"
origin = '''
**高精度颜色匹配（实验性功能）**:将聚类中心约束在打印机可达颜色集合内，减少颜色偏移；性能可能略慢，仅在 LUT 颜色匹配模式生效。
'''
translate = '''
'''

[[block]]
key = "4d73da2302b9cb06"
type = "paragraph"
origin = '''
**自动动态范围（实验性功能）**:根据所选 LUT 或耗材档案的可达亮度范围，对原图 L* 进行压缩映射；高光与阴影使用软滚降以保留局部对比度，色度通道保持不变。
'''
translate = '''
'''

[[block]]
key = "37535b6abd72dd54"
type = "paragraph"
origin = '''
**3D高精度颜色预览**:开启后，3D 预览的颜色网格上限会提升到当前量化颜色数；可减少低频颜色被合并成灰色，但 GLB 生成和浏览器渲染会更慢。
'''
translate = '''
'''

[[block]]
key = "ba7487e48f73a153"
type = "paragraph"
origin = '''
**色相保护**:在色彩匹配时优先保护色相，减少色相漂移。适合色彩准确度要求高、颜色种类多的图像。
'''
translate = '''
'''

[[block]]
key = "bef3bee8ff528d70"
type = "paragraph"
origin = '''
**解锁量化颜色数**:解锁后最高可拉到 8192，会显著增加内存占用与处理耗时，仅适合极端场景
'''
translate = '''
'''

[[block]]
key = "c716ca167fa438a1"
type = "heading"
origin = '''
#### 10.高级设置区
'''
translate = '''
'''

[[block]]
key = "b20b9e82eb6df50e"
type = "paragraph"
origin = '''
**挂件环设置**：生成钥匙扣环功能，方便用户直接对特定位置进行生成。
'''
translate = '''
'''

[[block]]
key = "a3150a160d4d01af"
type = "paragraph"
origin = '''
**冰箱贴磁铁槽**：冰箱贴磁铁凹槽功能，方便用户直接对冰箱贴挖孔放磁铁。
'''
translate = '''
'''

[[block]]
key = "7b1099efbeab9cd4"
type = "paragraph"
origin = '''
**拼图设置**：直接生成切分好的拼图，可以让更小尺寸的打印机打印更大的拼图。
'''
translate = '''
'''

[[block]]
key = "efb87c75fe0d6ce5"
type = "paragraph"
origin = '''
**透明镀层设置**：对模型底层生成特定高度的独立层，打印的时候使用透明耗材进行打印，可以增加观感，也可以改善首层粘不住的情况。
'''
translate = '''
'''

[[block]]
key = "8fc4d11418773efe"
type = "paragraph"
origin = '''
**掐丝珐琅设置**：
'''
translate = '''
'''

[[block]]
key = "59bc4e1c51a2bad3"
type = "paragraph"
origin = '''
**外轮廓设置**：对图片边缘进行描边。
'''
translate = '''
'''

[[block]]
key = "8d944ce9d8e832b8"
type = "paragraph"
origin = '''
**浮雕设置** ：生成2.5d浮雕效果，杂色过多的情况下不建议使用
'''
translate = '''
'''

