'''

[[block]]
key = "af67aeb7dda47c7d-5ff63c27394ddf6c"
type = "listItem"
composite = true
origin = '''
1. {{af67aeb7dda47c7d-5ff63c27394ddf6c-96ab9c5c15a53162}}
'''
translate = '''
'''

[[block]]
key = "af67aeb7dda47c7d-5ff63c27394ddf6c-96ab9c5c15a53162"
type = "paragraph"
origin = '''
当你的耗材无法凑齐整套的时候，例如有些品牌的耗材，无法凑齐八色，这时候你可以使用其他牌子来补齐剩余的颜色
'''
translate = '''
'''

[[block]]
key = "af67aeb7dda47c7d-b42a60f584359c52"
type = "listItem"
composite = true
origin = '''
2. {{af67aeb7dda47c7d-b42a60f584359c52-c2837d5beb1b3898}}
'''
translate = '''
'''

[[block]]
key = "af67aeb7dda47c7d-b42a60f584359c52-c2837d5beb1b3898"
type = "paragraph"
origin = '''
不同颜色的耗材消耗速度不同，有的颜色消耗比较快。这时候剩下的耗材，可以和其他品牌的耗材组合。
'''
translate = '''
'''

[[block]]
key = "af67aeb7dda47c7d-83758c33607029f5"
type = "listItem"
composite = true
origin = '''
3. {{af67aeb7dda47c7d-83758c33607029f5-5f1a7d803e5ecfde}}
'''
translate = '''
'''

[[block]]
key = "af67aeb7dda47c7d-83758c33607029f5-5f1a7d803e5ecfde"
type = "paragraph"
origin = '''
某些图片或者LUT，对一些色系的显示效果较差（如肤色，灰色等色系）。这时候你可以通过4，6，8色的套装，额外补充特定的颜色，如肤色，浅灰色。进行打印效果的完善。梯度色卡的耗材数量不受限制，所以理论上只要你的AMS和耗材更多，你就能有更好的成品。
'''
translate = '''
'''

