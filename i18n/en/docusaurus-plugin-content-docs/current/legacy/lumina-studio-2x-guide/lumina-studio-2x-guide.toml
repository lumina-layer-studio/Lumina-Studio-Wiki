origin = '''
#### 3.调节尺寸/大画幅切分
'''
translate = '''
'''

[[block]]
key = "00ba6270de944b57"
type = "paragraph"
origin = '''
**自定义尺寸**：按照原图的比例缩放尺寸
**大画幅切分**：可以设置总尺寸，然后根据单块尺寸进行切分
'''
translate = '''
'''

