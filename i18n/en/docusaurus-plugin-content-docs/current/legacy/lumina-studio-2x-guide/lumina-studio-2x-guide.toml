[[block]]
key = "ced6ab6199bdc0dc"
type = "heading"
origin = '''
#### 2.模式选择/LUT选择区：
'''
translate = '''
'''

[[block]]
key = "571cc6101d196c63"
type = "paragraph"
origin = '''
**LUT模式**：沿用旧版本1.X的lut校准文件，5层叠色穷举和去重穷举。
优点是所见即所得，按打印的色卡选择颜色。
缺点是更换不同品牌需要重新打印色卡。
'''
translate = '''
'''

[[block]]
key = "0529d9ebc3623eca"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/lumina204.png').default}
  alt="lumina204.png"
/>
'''
translate = '''
'''

[[block]]
key = "3d441f40b037707b"
type = "paragraph"
origin = '''
**耗材档案**：也称为梯度卡模式，当前模式可以脱离固定搭配。
优点是高度自定义,按单耗材进行校准，可以混选不同品牌不同颜色的耗材自定义选择层高和层数以及耗材数量。
缺点是由于是计算结果，部分颜色可能会有偏差。
'''
translate = '''
'''

[[block]]
key = "0da9cbbc301c7083"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/lumina205.png').default}
  alt="lumina205.png"
/>
'''
translate = '''
'''

