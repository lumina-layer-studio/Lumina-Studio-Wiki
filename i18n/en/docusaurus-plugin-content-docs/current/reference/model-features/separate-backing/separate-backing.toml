## 关闭时
'''
translate = '''
## When disabled
'''

[[block]]
key = "0e6d22ad1eaab442"
type = "paragraph"
origin = '''
底板会并入当前选定的底板耗材对象。切片软件会将其与使用同一耗材的画面区域视为单个对象，对象列表更精简。
'''
translate = '''
The backing merges into the object assigned to the selected backing filament. Your slicer presents it alongside artwork geometry that shares the same filament, keeping the object list compact.
'''

[[block]]
key = "041a32a83e21cd8a"
type = "heading"
origin = '''
## 开启时
'''
translate = '''
## When enabled
'''

[[block]]
key = "73069763a89a3323"
type = "paragraph"
origin = '''
软件会保留独立的底板网格：
'''
translate = '''
Lumina writes a dedicated backing mesh:
'''

[[block]]
key = "0af219908392721c"
type = "list"
composite = true
origin = '''
{{0af219908392721c-396df6912d197cd9}}
