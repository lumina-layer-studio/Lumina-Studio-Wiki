[[block]]
key = "37d92e9560e6cb42-6caff6db8deca768-bd04167872ff9f4b"
type = "paragraph"
origin = '''
**金属丝宽度：** 0.2–1.2 mm，步进 0.1 mm，控制线框在水平面上的线宽。
'''
translate = '''
**Wire Width:** 0.2–1.2 mm in 0.1 mm steps. Controls horizontal wireframe thickness.
'''

[[block]]
key = "37d92e9560e6cb42-c999706bb4697eb8"
type = "listItem"
composite = true
origin = '''
- {{37d92e9560e6cb42-c999706bb4697eb8-3f7954636c020865}}
'''
