key = "5ecb209b1e4265ee-e3d11e963a949ae3-d960d52d99fc8347"
type = "paragraph"
origin = '''
**采样方式**：可选均值或中位数。色块表面有细微灰尘或局部噪点时，中位数更具抗干扰性。
'''
translate = '''
**Sampling method:** Choose mean or median. Median is more resistant to minor dust or surface speckle inside a patch.
'''

[[block]]
key = "5ecb209b1e4265ee-e7c6d705ee1cb1f5"
type = "listItem"
composite = true
origin = '''
