'''
translate = '''
Return to Studio and wait for **Community account connected**.
'''

[[block]]
key = "7de299c68a78f93f"
type = "paragraph"
origin = '''
连接码有效期为 10 分钟，只能确认一次；过期后重新发起连接。已有账号但尚未验证邮箱时，先用原来的登录方式进入，再验证邮箱，原来的投稿和收藏会保留。
'''
translate = '''
The connection code is valid for 10 minutes and can be confirmed only once. Start again if it expires. If an existing account has no verified email, sign in using its original method before verifying the email, preserving its submissions and saved resources.
'''

[[block]]
key = "58d3f565de248fd9"
type = "paragraph"
origin = '''
桌面端能安全记住账号时，下次启动会自动连接；使用浏览器或环境不支持安全存储时，界面会提示“重启软件后需要重新登录”。可通过“管理邮箱与设备”查看和撤销已连接设备。
'''
translate = '''
When secure account storage is available on desktop, Studio reconnects on the next launch. Browser sessions and environments without secure storage display **Valid until Studio restarts**. Use **Account & devices** to view or revoke connected devices.
'''

[[block]]
key = "58fec43e0fbf8067"
type = "heading"
origin = '''
## 点赞、收藏与本机常用
'''
translate = '''
## Likes, saved resources and local favorites
'''

[[block]]
key = "a718d131ee1e75b2"
type = "paragraph"
origin = '''
公开资源的点赞、收藏和下载人数可以直接查看。登录后点击点赞或收藏，状态会归到当前社区账号；耗材库、LUT 库和转换选择器中的相应入口共用这些记录。
'''
translate = '''
Public resources display like, save and download counts without requiring sign-in. Once connected, likes and saves belong to the current community account. The corresponding material library, LUT library and converter pickers use the same records.
'''

[[block]]
key = "cdc7c59b7333ff4d"
type = "paragraph"
origin = '''
在桌面版中，收藏只记录想保留的条目，不会自动下载全部收藏。需要使用尚未安装的资源时，再从云端选择并下载。纯本地档案仍可设为“本机常用”，它与账号收藏是两种记录。在线站使用预装资源，见下方[在线预览站与桌面版](#在线预览站与桌面版)。
'''
translate = '''
In the desktop edition, saving records an entry you want to keep; it does not download all saved resources. Select and download an uninstalled item when you need it. Purely local profiles can still be marked as local favorites, separately from account-saved resources. The online site uses preinstalled resources; see [Online preview and desktop use](#online-preview-and-desktop-use) below.
'''

[[block]]
key = "9009b8f4c63e0db4"
type = "table"
origin = '''
| 操作或显示 | 含义 |
| --- | --- |
| 取消收藏 | 取消当前账号的收藏，不删除本地文件或当前配色选择 |
| 切换或断开账号 | 当前个人状态随账号切换，本地已安装资料保留 |
| 下载人数 | 成功下载的不同账号数，同一账号重复下载不重复计数 |
| 数量显示“—” | 统计尚未取得或资源未能对应，不能当作零人使用 |
'''
translate = '''
| Action or display | Meaning |
| --- | --- |
| Unsave | Removes the account's saved entry without deleting local files or changing the current palette |
| Switch or disconnect an account | Personal state follows the account; installed local resources remain |
| Download count | Distinct accounts that downloaded successfully; repeated downloads by one account count once |
| A count shown as “—” | Statistics are unavailable or the resource could not be matched; this is not a count of zero |
'''

