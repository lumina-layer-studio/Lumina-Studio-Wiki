type = "paragraph"
origin = '''
在“我的投稿”查看状态和审核意见；待审条目可先撤回再修改，已公开资源可提交新修订。
'''
translate = '''
Open **My submissions** to follow status and reviewer feedback. Pending entries can be withdrawn for editing; published resources can receive a new revision.
'''

[[block]]
key = "36c612832518aa72"
type = "paragraph"
origin = '''
提交不是立即公开。资料修订审核期间，已公开的旧版仍可使用。填写商品名或购买链接不会改变 LUT 配方数据，也不会使投稿账号自动获得品牌官方身份。
'''
translate = '''
Submitting does not publish immediately. A published revision remains available while an update is reviewed. Editing product names or purchase links does not alter a LUT's recipe data, and submitting does not confer official brand status on an account.
'''

[[block]]
key = "3cda80def0d5b597"
type = "heading"
origin = '''
## 自动贡献默认关闭
'''
translate = '''
## Automatic contributions are off by default
'''

[[block]]
key = "2016add70ccbb7be"
type = "paragraph"
origin = '''
希望持续分享自己的校准结果时，可在“我的投稿”中单独阅读并确认自动贡献设置。开启后，今后新保存的校准会进入提交队列；普通浏览、下载、导入和已有历史文件不会因此自动上传。
'''
translate = '''
To keep sharing your own calibrations, separately read and confirm the automatic-contribution setting in **My submissions**. Once enabled, newly saved calibrations enter the submission queue. Browsing, downloading, importing and existing historical files do not trigger uploads.
'''

[[block]]
key = "ae649f070fbd2756"
type = "paragraph"
origin = '''
资料不全时，队列会停在“本机待提交”，补齐后再继续。断网时保留待提交内容；关闭自动贡献或断开账号会暂停未开始的任务，重新开启不会擅自恢复旧任务。
'''
translate = '''
Incomplete entries wait locally for the missing information. Offline submissions remain queued. Disabling automatic contributions or disconnecting pauses tasks that have not started; enabling it again does not silently resume old tasks.
'''

[[block]]
key = "6faba3f44a2dd1ba"
type = "heading"
origin = '''
## 在线预览站与桌面版
'''
translate = '''
## Online preview and desktop use
'''

[[block]]
key = "4f6451cb99f493ba"
type = "paragraph"
origin = '''
[在线预览站](https://test.luminastudio.com.cn/)免登录即可试用，每天可导出 3 张不同原图。通过右下角“登录 Lumina 账号 · 再享 +3 张/天”或耗材／LUT 库的社区账号入口连接后，可同步个人点赞与收藏，并额外获得每天 3 张新图的导出额度，合计每天 6 张。具体连接步骤与计数方式见[在线预览与导出额度](../../../getting-started/online-preview/online-preview.mdx)。
'''
translate = '''
The [online preview site](https://test.luminastudio.com.cn/) allows exports for 3 distinct source images per day without signing in. Connect using the Lumina sign-in button offering +3 images/day in the bottom-right status card, or the community-account entry in the material or LUT library. This syncs your likes and saved resources and unlocks 3 additional new-image exports per day, for a total of 6. See [Online Preview and Export Allowance](../../../getting-started/online-preview/online-preview.mdx) for connection steps and counting rules.
'''

[[block]]
key = "0560118b8c7d2a07"
type = "paragraph"
origin = '''
在线站已预装公开耗材与 LUT 库，可在选择器中按点赞或收藏筛选这些资源，无需逐条下载安装。按需下载到私人库、管理个人耗材与 LUT，以及“贡献到公共库”和“我的投稿”管理，请在桌面版完成；在线站的投稿入口会引导前往桌面版。
'''
translate = '''
The online site has public materials and LUTs preinstalled. Filter them by your likes or saved resources in the pickers without downloading or installing each item. Use the desktop edition for on-demand downloads into a private library, personal material and LUT management, **Share to public library**, and **My submissions**. Submission entries on the online site direct you to the desktop edition.
'''

[[block]]
key = "d4156995f1699913"
type = "paragraph"
origin = '''
上述每日额度属于在线站；桌面打包版的离线和本地使用不要求连接社区账号。
'''
translate = '''
These daily allowances belong to the online site. Local and offline use of the packaged desktop edition does not require a community account.
'''
