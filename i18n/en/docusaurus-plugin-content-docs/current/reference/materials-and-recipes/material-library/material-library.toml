**Layer Height**: The calibration layer height used when printing and fitting the gradient cards.
'''

[[block]]
key = "af86ce77c9691db9"
type = "heading"
origin = '''
## 顶部操作
'''
translate = '''
## Top toolbar
'''

[[block]]
key = "1e51be806d20bccd"
type = "paragraph"
origin = '''
顶部工具栏中，“全选耗材”用于快速勾选当前列表中的档案以便批量导出；“刷新耗材库”用于重新读取本地存储中的最新档案列表。
'''
translate = '''
In the top toolbar, **Select All** selects every archive in the list for batch export, and **Refresh Library** reloads the latest archives from local storage.
'''

[[block]]
key = "5a57cf5590526a06"
type = "paragraph"
origin = '''
批量备份与跨机迁移见[导入与导出耗材](../material-import-export/material-import-export.mdx)。单份档案的“编辑信息”“再次验证”“展开验证历史”与“删除耗材”操作说明见[编辑与复验耗材](../material-edit-and-verification/material-edit-and-verification.mdx)。
'''
translate = '''
For batch backups and transfers, see [Material Import and Export](../material-import-export/material-import-export.mdx). For **Edit Details**, **Re-Verify**, **Verification History**, and **Delete Material**, see [Editing and Re-Verification](../material-edit-and-verification/material-edit-and-verification.mdx).
'''

[[block]]
key = "75b96e9b2f202915"
type = "paragraph"
origin = '''
本地没有对应档案时，可以到[云端耗材库](../cloud-material-library/cloud-material-library.mdx)按需下载，或从离线包挑选。想比较几卷耗材搭配后的颜色范围，可打开[色域覆盖](../material-gamut/material-gamut.mdx)；计算结果的复用与清理见[求解缓存](../material-solver-cache/material-solver-cache.mdx)。
'''
translate = '''
If a profile is missing locally, download it from the [Cloud Material Library](../cloud-material-library/cloud-material-library.mdx) or choose it from an offline pack. Use [Gamut coverage](../material-gamut/material-gamut.mdx) to compare the color range of a filament combination; see [Solver cache](../material-solver-cache/material-solver-cache.mdx) for reusing and clearing calculation results.
'''

[[block]]
key = "f73c01cb8a23cea6"
type = "paragraph"
origin = '''
“我的投稿”和资源详情中的“贡献到公共库”用于分享自己的校准。社区账号连接、收藏同步与审核流程见[社区账号、收藏与投稿](../community-resources/community-resources.mdx)。
'''
translate = '''
Use **My submissions** and **Share to public library** in resource details to share your own calibrations. Account connection, saved resources and review are explained in [Community account, saved resources and submissions](../community-resources/community-resources.mdx).
'''

