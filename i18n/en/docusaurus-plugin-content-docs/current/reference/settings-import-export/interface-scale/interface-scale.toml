/>
'''
translate = '''
<img
  src={require('./assets/01-interface-scale.webp').default}
  alt="Interface scale in the General settings of the Lumina Studio desktop app"
/>
'''

[[block]]
key = "948597074db63584"
type = "paragraph"
origin = '''
也可通过快捷键逐档调节：Windows 与 Linux 按 `Ctrl` 加 `+` 或 `-` 缩放，按 `Ctrl + 0` 恢复 100%；macOS 将 `Ctrl` 替换为 `Command` 即可。
'''
translate = '''
You can also step zoom up or down with `Ctrl` plus `+` or `-` on Windows and Linux, and press `Ctrl + 0` to reset to 100%. On macOS, use `Command` instead of `Ctrl`.
'''

[[block]]
key = "699bc73123a2abe9"
type = "paragraph"
origin = '''
该选项仅在桌面版中提供。在浏览器中使用网页版时，可直接使用浏览器的页面缩放功能，两者缩放比例各自独立保存。
'''
translate = '''
This setting applies to the desktop app. When using Lumina in a web browser, use your browser's built-in page zoom; browser zoom and desktop scale are stored independently.
'''
