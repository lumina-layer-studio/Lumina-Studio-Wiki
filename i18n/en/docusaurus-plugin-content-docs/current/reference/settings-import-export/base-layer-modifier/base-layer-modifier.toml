[[block]]
key = "4e9932449cebbb93"
type = "heading"
origin = '''
# 底板层高修改器
'''
translate = '''
# Base-plate Layer-height Modifier
'''

[[block]]
key = "e23c2264078f0584"
type = "paragraph"
origin = '''
开启“底板层高修改器”后，软件会在生成的 3MF 中写入可变层高配置：纯底板部分使用较粗层高以缩短打印耗时，上方的彩色图案区域仍保持原有的精细层高。
'''
translate = '''
**Base-plate Layer-height Modifier** writes variable layer-height ranges into the exported 3MF so the plain backing prints with coarser layers to save time, while the colored artwork above retains its fine layer height.
'''

[[block]]
key = "6976de6a07818655"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/01-base-layer-modifier.webp').default}
  alt="系统设置中的底板层高修改器开关"
/>
'''
translate = '''
<img
  src={require('./assets/01-base-layer-modifier.webp').default}
  alt="Base-plate layer-height modifier in System Settings"
/>
'''

[[block]]
key = "840ca9f0882c4758"
type = "heading"
origin = '''
## 层高写入规则
'''
translate = '''
## Layer-height rules
'''

[[block]]
key = "2c4636d167a7b967"
type = "paragraph"
origin = '''
底板层高取当前喷嘴直径的一半：
'''
translate = '''
The base-plate layer height equals half the nozzle diameter:
'''

[[block]]
key = "b734765e63876f10"
type = "table"
origin = '''
| 喷嘴 | 底板层高 |
| --- | --- |
| 0.2 mm | 0.1 mm |
| 0.4 mm | 0.2 mm |
'''
translate = '''
| Nozzle | Base-plate layer height |
| --- | --- |
| 0.2 mm | 0.1 mm |
| 0.4 mm | 0.2 mm |
'''

[[block]]
key = "fb97961d346bd97d"
type = "paragraph"
origin = '''
Lumina Studio 会将该区间写入 3MF 的 `layer_config_ranges` 配置中。切片软件读取工程后，即可在同一对象内为底板层与显色层分别应用对应层高。
'''
translate = '''
Lumina Studio writes this range into the 3MF `layer_config_ranges` metadata, allowing compatible slicers to apply separate layer heights to the backing and color layers within the same object.
'''

