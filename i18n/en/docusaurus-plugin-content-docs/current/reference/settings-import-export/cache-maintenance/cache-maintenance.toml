origin = '''
# 缓存管理
'''
translate = '''
# Cache Management
'''

[[block]]
key = "64b39f8853a7f9c9"
type = "paragraph"
origin = '''
这里清理的是运行中的临时文件与转换会话。耗材组合的穷举、智能或动态层数计算结果，由[求解缓存](../../materials-and-recipes/material-solver-cache/material-solver-cache.mdx)单独管理。
'''
translate = '''
This operation clears temporary runtime files and conversion sessions. Exhaustive, smart and dynamic-layer calculations for material combinations are managed separately under [Solver cache](../../materials-and-recipes/material-solver-cache/material-solver-cache.mdx).
'''

[[block]]
key = "4bb19cd500d90324"
type = "paragraph"
origin = '''
点击“清除缓存”可删除后台运行期间产生的临时文件、预览模型与转换会话数据，并在完成后显示清理的文件数量与释放的存储空间。
'''
translate = '''
**Clear Cache** deletes temporary runtime files, preview meshes, and conversion sessions, then reports the number of files removed and the disk space reclaimed.
'''

