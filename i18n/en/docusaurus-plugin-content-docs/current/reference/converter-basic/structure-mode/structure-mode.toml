[[block]]
key = "a0c4dc6ce346d689"
type = "heading"
origin = '''
# 结构模式
'''
translate = '''
# Structure Mode
'''

[[block]]
key = "b9f48a9365a1d9a4"
type = "paragraph"
origin = '''
**结构模式**决定彩色图案层生成在底板的单侧还是双侧。
'''
translate = '''
**Structure Mode** controls whether color layers are built on one side or both sides of the base plate.
'''

