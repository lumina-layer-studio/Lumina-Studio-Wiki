key = "33e0d964c92c6d6d"
type = "paragraph"
origin = '''
若你使用的是通过梯度卡实测并保存在耗材库中的单卷耗材数据，请选择**耗材档案**并直接从耗材库调用；**经典 LUT** 仅用于加载预生成的查找表文件。
'''
translate = '''
When working with individual spools measured from gradient cards in your material library, select **Material Archive** directly; **Classic LUT** is solely for prebuilt lookup tables.
'''
