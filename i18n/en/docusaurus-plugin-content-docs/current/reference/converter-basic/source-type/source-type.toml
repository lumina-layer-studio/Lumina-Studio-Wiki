[[block]]
key = "fda121dce165a910"
type = "heading"
origin = '''
# 色彩数据来源
'''
translate = '''
# Color Data Source
'''

[[block]]
key = "e6661fa77524fea1"
type = "paragraph"
origin = '''
**色彩数据来源**决定 Lumina Studio 依据哪类色彩数据，将图片颜色转换为可打印的逐层耗材配方。切换来源不会改动原图，但会同步切换下方可配置的耗材组合或品牌 LUT、叠色层数及底板耗材选项。
'''
translate = '''
**Color Data Source** selects which color data Lumina Studio uses to convert image colors into printable, layer-by-layer filament recipes. Changing the source leaves your artwork untouched while updating the material library, brand LUT, layer count, and base plate options shown below it.
'''

[[block]]
key = "e1c52527162e7ab6"
type = "mdxJsxFlowElement"
origin = '''
