origin = '''
# 大画幅模式
'''
translate = '''
# Large Format Mode
'''

[[block]]
key = "6498932932e8322d"
type = "paragraph"
origin = '''
**大画幅模式**可将超出单块热床幅面或不便单次打印的作品切分为多块子板，每块独立生成 3MF 文件，并统一打包为 ZIP 压缩包下载。
'''
translate = '''
**Large Format** splits artwork that exceeds a single build plate into a grid of separate 3MF tiles and packages them together as a downloadable ZIP archive.
'''

