[[block]]
key = "fade9427f2d8ebf8"
type = "heading"
origin = '''
## 成品尺寸与切片尺寸
'''
translate = '''
## Finished size and tile size
'''

[[block]]
key = "f236ff2ab03eb292"
type = "paragraph"
origin = '''
开启大画幅模式后，作品成品宽高的上限会从 `400 mm` 扩展至 **9999 mm**。**切片宽度**与**切片高度**可在 **50–500 mm** 范围内调节，步长为 **10 mm**。
'''
translate = '''
Enabling **Large Format** raises the maximum finished width and height from `400 mm` to **9999 mm**. **Tile Width** and **Tile Height** can each be set from **50–500 mm** in **10 mm** steps.
'''

