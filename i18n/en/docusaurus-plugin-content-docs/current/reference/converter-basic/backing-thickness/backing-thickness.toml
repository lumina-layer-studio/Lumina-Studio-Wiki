[[block]]
key = "849a9416a58666ef"
type = "heading"
origin = '''
# 底板厚度
'''
translate = '''
# Base-Plate Thickness
'''

[[block]]
key = "b67f133e6aef61f7"
type = "paragraph"
origin = '''
**底板厚度**用于设置彩色显色层下方结构底板的高度，默认值为 **1.20 mm**。
'''
translate = '''
**Base plate thickness** sets the height of the structural foundation beneath the optical color layers. The default value is **1.20 mm**.
'''

[[block]]
key = "9ffc095d3f282eeb"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/01-backing-thickness.webp').default}
