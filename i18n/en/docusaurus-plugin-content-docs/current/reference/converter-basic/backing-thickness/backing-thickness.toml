key = "efb08e626d2a6381-67d8559f210fcb4d-3936dbe239f4c594"
type = "paragraph"
origin = '''
**浮雕：** 开启后，软件会自动确保浮雕起伏高度不低于当前底板与显色层所需的最小安全厚度。
'''
translate = '''
**Relief:** Ensures extra relief height meets at least the minimum required by the current base and color layers.
'''

