[[block]]
key = "900cdda489bf91f5"
type = "heading"
origin = '''
# 切片软件与下载
'''
translate = '''
# Slicer and downloads
'''

[[block]]
key = "73d58ca5e85714e9"
type = "paragraph"
origin = '''
Lumina Studio 会自动检测本机已安装的切片软件，并默认选中“设置”里指定的首选切片软件。主输出按钮的具体动作取决于本机是否检测到可用切片软件、当前是否已生成 3MF，以及是否启用了大画幅或独立背板。
'''
translate = '''
Lumina Studio detects compatible slicers installed on your computer and prioritizes the preferred application configured in Settings. What the primary output button does depends on whether a slicer is available, whether a 3MF is already built, and whether Large Format or separate backing is enabled.
'''

[[block]]
key = "8525c25e6440e50c"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/01-slicer-list.webp').default}
