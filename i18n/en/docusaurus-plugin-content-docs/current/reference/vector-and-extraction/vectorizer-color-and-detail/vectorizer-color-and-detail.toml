[[block]]
key = "6a2eee7fae02cbc2"
type = "heading"
origin = '''
# 颜色数量、平滑度与细节等级
'''
translate = '''
# Colors, Smoothness, and Detail
'''

[[block]]
key = "7bdf5852e775f1df"
type = "paragraph"
origin = '''
基础参数决定了矢量化结果保留多少种颜色，以及轮廓路径在“贴合原图细节”与“线条简洁流畅”之间的平衡点。
'''
translate = '''
The basic parameters control how many colors remain in the palette and how closely vectorized paths follow fine source details versus clean, simplified curves.
'''

[[block]]
key = "d67df144f2cc2b3c"
type = "mdxJsxFlowElement"
origin = '''
