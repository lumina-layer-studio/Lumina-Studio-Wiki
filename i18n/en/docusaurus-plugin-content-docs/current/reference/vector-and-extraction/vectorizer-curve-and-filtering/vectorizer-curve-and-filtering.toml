### 最小区域面积与最大合并色差
'''
translate = '''
### Min Region Area and Max Merge Color Dist
'''

[[block]]
key = "8e8aa85df20eb5c7"
type = "list"
composite = true
origin = '''
{{8e8aa85df20eb5c7-8f4dbf400bc92cdd}}
{{8e8aa85df20eb5c7-2e4ddb0b8f68275f}}
'''
translate = '''
{{8e8aa85df20eb5c7-8f4dbf400bc92cdd}}
{{8e8aa85df20eb5c7-2e4ddb0b8f68275f}}
'''

[[block]]
key = "8e8aa85df20eb5c7-8f4dbf400bc92cdd"
type = "listItem"
composite = true
origin = '''
- {{8e8aa85df20eb5c7-8f4dbf400bc92cdd-069078abc480e3a9}}
'''
translate = '''
- {{8e8aa85df20eb5c7-8f4dbf400bc92cdd-069078abc480e3a9}}
'''

[[block]]
key = "8e8aa85df20eb5c7-8f4dbf400bc92cdd-069078abc480e3a9"
type = "paragraph"
origin = '''
**最小区域面积**：取值范围为 `0–1000 px²`，默认值为 `50 px²`。颜色分割阶段面积小于该阈值的色块，会优先尝试并入相邻区域。
'''
translate = '''
**Min Region Area**: ranges from `0–1000 px²`, with a default of `50 px²`. Segmented color regions smaller than this area become candidates to merge into a neighboring region.
'''

[[block]]
key = "8e8aa85df20eb5c7-2e4ddb0b8f68275f"
type = "listItem"
composite = true
origin = '''
- {{8e8aa85df20eb5c7-2e4ddb0b8f68275f-1900ddbbb8208937}}
'''
translate = '''
- {{8e8aa85df20eb5c7-2e4ddb0b8f68275f-1900ddbbb8208937}}
'''

[[block]]
key = "8e8aa85df20eb5c7-2e4ddb0b8f68275f-1900ddbbb8208937"
type = "paragraph"
origin = '''
**最大合并色差**：取值范围为 `0–500`，默认值为 `200`（单位为 LAB ΔE²），用于限制上述合并允许的最大颜色差异。数值越大，反差更明显的小碎块也能被邻近色块吸收。
'''
translate = '''
**Max Merge Color Dist**: ranges from `0–500`, with a default of `200` (measured in LAB ΔE²). Caps how different a neighbor's color may be when absorbing a small region—higher values allow higher-contrast speckles to merge.
'''

[[block]]
key = "41466cdaa33f94c8"
type = "heading"
origin = '''
### 最小轮廓面积
'''
translate = '''
### Min Contour Area
'''

[[block]]
key = "40cd036d6ff00c9d"
type = "paragraph"
origin = '''
取值范围为 `0–500 px²`，默认值为 `10 px²`。轮廓追踪完成后，面积仍小于该值的独立悬浮形状会被直接剔除。该步骤在“最小区域面积”合并之后执行，专门清理未能并入邻区的零星残片。
'''
translate = '''
Ranges from `0–500 px²`, with a default of `10 px²`. Discards standalone shapes smaller than this area after contour tracing. Because it runs after **Min Region Area**, it catches isolated fragments that could not merge into an adjacent color.
'''

[[block]]
key = "070ba6116d4ab292"
type = "heading"
origin = '''
### 最小孔洞面积
'''
translate = '''
### Min Hole Area
'''

[[block]]
key = "758671ce427ebeaa"
type = "paragraph"
origin = '''
取值范围为 `0–100 px²`，默认值为 `4 px²`。色块内部面积小于该值的细小镂空会被自动填平；大于或等于该值的孔洞则保留为空白镂空路径。
'''
translate = '''
Ranges from `0–100 px²`, with a default of `4 px²`. Fills enclosed interior pinholes smaller than this area while preserving larger cutouts as open holes in the SVG path.
'''

[[block]]
key = "c72804b1f1b21f9f"
type = "paragraph"
origin = '''
排查画面碎片时，可先放大观察目标属于“紧贴邻区的分割小色块”“孤立的小轮廓”还是“色块内部的针孔镂空”，再针对性上调对应阈值。
'''
translate = '''
When cleaning up artifacts, zoom in first to see whether the unwanted specks are adjacent segmented patches, isolated contours, or tiny interior pinholes, then raise the matching threshold.
'''

