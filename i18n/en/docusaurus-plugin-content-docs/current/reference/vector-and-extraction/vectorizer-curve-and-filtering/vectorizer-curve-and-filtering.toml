### 曲线拟合误差
'''
translate = '''
### Curve Fit Error
'''

[[block]]
key = "3c2c0468ab6ff107"
type = "paragraph"
origin = '''
取值范围为 `0.1–5 px`，默认值为 `0.8 px`，定义 Schneider 贝塞尔曲线拟合允许的最大像素偏差：
'''
translate = '''
Ranges from `0.1–5 px`, with a default of `0.8 px`. Sets the maximum pixel error allowed during Schneider Bézier curve fitting:
'''

[[block]]
key = "4610d782ab371985"
type = "list"
composite = true
origin = '''
{{4610d782ab371985-f8430209befeed65}}
{{4610d782ab371985-ddb9b5665e678c0e}}
'''
