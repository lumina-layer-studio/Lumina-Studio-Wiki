'''

[[block]]
key = "4610d782ab371985-f8430209befeed65-ce0fde84ff43adb7"
type = "paragraph"
origin = '''
**调小数值**：曲线紧密贴合原始像素边界，生成的控制点更多；
'''
translate = '''
**Smaller values** hug the source boundary more tightly using more control points.
'''

[[block]]
key = "4610d782ab371985-ddb9b5665e678c0e"
type = "listItem"
composite = true
origin = '''
- {{4610d782ab371985-ddb9b5665e678c0e-93f97571063d2d15}}
'''
translate = '''
- {{4610d782ab371985-ddb9b5665e678c0e-93f97571063d2d15}}
'''

[[block]]
key = "4610d782ab371985-ddb9b5665e678c0e-93f97571063d2d15"
type = "paragraph"
origin = '''
**调大数值**：控制点减少、曲线更舒展平滑，但细小转折会被略过。
'''
translate = '''
**Larger values** generate smoother curves with fewer control points, softening fine detail.
'''

[[block]]
key = "0e26ab6ea87d112b"
type = "heading"
origin = '''
### 轮廓简化强度
'''
translate = '''
### Contour Simplification
'''

[[block]]
key = "33790662903a10c5"
type = "paragraph"
origin = '''
取值范围为 `0–2`，默认值为 `0.45`。调高后会在进入贝塞尔拟合之前先行精简原始轮廓点，从源头降低路径复杂度；“曲线拟合误差”则约束后续拟合阶段偏离轮廓的幅度，两者配合决定最终节点密度。
'''
translate = '''
Ranges from `0–2`, with a default of `0.45`. Raising this value prunes raw boundary vertices before Bézier fitting begins, reducing overall path complexity, whereas **Curve Fit Error** governs how closely the fitted curves track those simplified vertices.
'''

[[block]]
key = "ca2d369f8a912bd3"
type = "heading"
origin = '''
### 线段合并容差
'''
translate = '''
### Merge Segment Tolerance
'''

[[block]]
key = "818fcd446c35e884"
type = "paragraph"
origin = '''
取值范围为 `0–0.5`，默认值为 `0.05`。当相邻近线性贝塞尔段的控制点偏差低于该容差时，系统会将其合并为单一段，减少长直边上的多余节点；调得过高时，轻微的折线转折也会被拉直。
'''
translate = '''
Ranges from `0–0.5`, with a default of `0.05`. Merges adjacent, nearly collinear Bézier segments whose control-point deviation falls within this threshold. Raising it cleans up redundant nodes along straight edges; setting it too high can flatten subtle bends.
'''

