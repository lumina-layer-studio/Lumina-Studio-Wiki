[[block]]
key = "f2745ef108aa98ad"
type = "heading"
origin = '''
## 超像素区域大小
'''
translate = '''
## SLIC Region Size
'''

[[block]]
key = "d3136f669a519d5e"
type = "paragraph"
origin = '''
取值范围为 `5–100`，默认值为 `20`，用于设定初始 SLIC 超像素的目标尺寸：
'''
translate = '''
Ranges from `5–100`, with a default of `20`. Sets the target size for initial SLIC superpixels:
'''

[[block]]
key = "cb99a6d827d366d9"
type = "list"
composite = true
origin = '''
{{cb99a6d827d366d9-9a6323f13ed183f5}}
{{cb99a6d827d366d9-f04ebe2ef84e9816}}
'''
translate = '''
{{cb99a6d827d366d9-9a6323f13ed183f5}}
{{cb99a6d827d366d9-f04ebe2ef84e9816}}
'''

[[block]]
key = "cb99a6d827d366d9-9a6323f13ed183f5"
type = "listItem"
composite = true
origin = '''
- {{cb99a6d827d366d9-9a6323f13ed183f5-557c5705e874cde9}}
'''
translate = '''
- {{cb99a6d827d366d9-9a6323f13ed183f5-557c5705e874cde9}}
'''

[[block]]
key = "cb99a6d827d366d9-9a6323f13ed183f5-557c5705e874cde9"
type = "paragraph"
origin = '''
**调小数值**：生成更密集的小超像素，能够捕捉更纤细的局部造型变化；
'''
translate = '''
**Smaller values** generate denser superpixels that capture finer local features.
'''

[[block]]
key = "cb99a6d827d366d9-f04ebe2ef84e9816"
type = "listItem"
composite = true
origin = '''
- {{cb99a6d827d366d9-f04ebe2ef84e9816-0f8893632dedd683}}
'''
translate = '''
- {{cb99a6d827d366d9-f04ebe2ef84e9816-0f8893632dedd683}}
'''

[[block]]
key = "cb99a6d827d366d9-f04ebe2ef84e9816-0f8893632dedd683"
type = "paragraph"
origin = '''
**调大数值**：生成更少、更大的超像素，计算更快，色块概括感更强。
'''
translate = '''
**Larger values** generate fewer, broader superpixels for faster processing and cleaner generalization.
'''

[[block]]
key = "438c8d20d8e0ca2f"
type = "paragraph"
origin = '''
后续的颜色合并、边界细化与区域过滤仍会进一步重组色块，因此该数值并非最终 SVG 形状的固定尺寸。
'''
translate = '''
Subsequent color merging, boundary refinement, and region filtering continue to reshape regions, so this setting does not lock final SVG shapes to a fixed size.
'''

[[block]]
key = "8d7a801e8e2682ed"
type = "heading"
origin = '''
## 边缘敏感度
'''
translate = '''
## Edge Sensitivity
'''

[[block]]
key = "8ee8443e5d4e85cc"
type = "paragraph"
origin = '''
取值范围为 `0–1`，默认值为 `0.8`，控制 SLIC 遇到明显颜色边界时放宽空间规则约束的程度：
'''
translate = '''
Ranges from `0–1`, with a default of `0.8`. Controls how strongly SLIC relaxes spatial regularity when it encounters a color edge:
'''

[[block]]
key = "79b155e6be0f7b30"
type = "list"
composite = true
origin = '''
{{79b155e6be0f7b30-332a8b3ba83a25f3}}
{{79b155e6be0f7b30-08b62f016c1fce3e}}
'''
translate = '''
{{79b155e6be0f7b30-332a8b3ba83a25f3}}
{{79b155e6be0f7b30-08b62f016c1fce3e}}
'''

