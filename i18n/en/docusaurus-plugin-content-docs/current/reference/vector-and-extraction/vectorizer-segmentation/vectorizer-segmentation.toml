key = "79b155e6be0f7b30-332a8b3ba83a25f3"
type = "listItem"
composite = true
origin = '''
- {{79b155e6be0f7b30-332a8b3ba83a25f3-76c0b6f21791ed49}}
'''
translate = '''
- {{79b155e6be0f7b30-332a8b3ba83a25f3-76c0b6f21791ed49}}
'''

[[block]]
key = "79b155e6be0f7b30-332a8b3ba83a25f3-76c0b6f21791ed49"
type = "paragraph"
origin = '''
**调高数值**：更积极地贴合颜色边缘收束分界；
'''
translate = '''
**Higher values** snap region boundaries tightly along color transitions.
'''

[[block]]
key = "79b155e6be0f7b30-08b62f016c1fce3e"
type = "listItem"
composite = true
origin = '''
- {{79b155e6be0f7b30-08b62f016c1fce3e-43f8cff721dd1447}}
'''
translate = '''
- {{79b155e6be0f7b30-08b62f016c1fce3e-43f8cff721dd1447}}
'''

[[block]]
key = "79b155e6be0f7b30-08b62f016c1fce3e-43f8cff721dd1447"
type = "paragraph"
origin = '''
**调低数值**：优先保持超像素网格的空间匀称度，生成的色块边界更舒展。
'''
translate = '''
**Lower values** favor uniform spatial cells and smoother, more regular boundaries.
'''

[[block]]
key = "c3872ccae945b1b5"
type = "heading"
origin = '''
## 边界细化次数
'''
translate = '''
## Refine Passes
'''

[[block]]
key = "cfb4ef2f1b8a4fce"
type = "paragraph"
origin = '''
取值范围为 `0–20`，默认值为 `6`。每一轮迭代都会参考邻域标签重新修正色块边界：调高次数可让边界更紧贴原图轮廓，同时相应延长处理时间；设为 `0` 则跳过边界细化阶段。
'''
translate = '''
Ranges from `0–20`, with a default of `6`. Each pass refines boundary labels against neighboring pixels—adding passes aligns boundaries more tightly to intricate edges at the cost of extra processing time, while `0` skips boundary refinement altogether.
'''

[[block]]
key = "f5456ae21b702765"
type = "heading"
origin = '''
## 抗锯齿检测与容差
'''
translate = '''
## Antialiasing Detection and AA Tolerance
'''

[[block]]
key = "432764347764c8d2"
type = "paragraph"
origin = '''
开启“抗锯齿检测”后，引擎会自动识别两种颜色交界处的半透明或混合过渡像素，避免将抗锯齿边缘拆成一圈零碎的杂色细带。
'''
translate = '''
Enabling **Antialiasing Detection** identifies blended transition pixels along the border between two colors so antialiased halos are merged cleanly instead of becoming thin, stray color bands.
'''

