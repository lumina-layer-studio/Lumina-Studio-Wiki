- {{4ddf3164d5e92df4-c8438b851a0e833a-32a63687660927a9}}
'''

[[block]]
key = "4ddf3164d5e92df4-c8438b851a0e833a-32a63687660927a9"
type = "paragraph"
origin = '''
**推荐开启**：边缘柔滑的插画、图标、徽标与文字素材；
'''
translate = '''
**Turn on** for smooth-edged illustrations, icons, logos, and typography.
'''

[[block]]
key = "4ddf3164d5e92df4-a438a28859437a28"
type = "listItem"
composite = true
origin = '''
- {{4ddf3164d5e92df4-a438a28859437a28-9add611b7e2ce01e}}
'''
translate = '''
- {{4ddf3164d5e92df4-a438a28859437a28-9add611b7e2ce01e}}
'''

[[block]]
key = "4ddf3164d5e92df4-a438a28859437a28-9add611b7e2ce01e"
type = "paragraph"
origin = '''
**建议关闭**：需要严格保留逐像素阶梯锯齿感的像素画（Pixel Art）。
'''
translate = '''
**Turn off** for pixel art when you want crisp, stair-stepped pixel edges preserved intact.
'''

[[block]]
key = "fa84b07703f00ef2"
type = "paragraph"
origin = '''
下方的“抗锯齿容差”取值范围为 `1–50`，默认值为 `10`（单位为 LAB ΔE）。数值越大，允许归入混合过渡边缘的色差范围越宽。
'''
translate = '''
**AA Tolerance** ranges from `1–50`, defaults to `10`, and is measured in LAB ΔE. Higher values allow a wider color difference to qualify as a blended edge pixel.
'''

