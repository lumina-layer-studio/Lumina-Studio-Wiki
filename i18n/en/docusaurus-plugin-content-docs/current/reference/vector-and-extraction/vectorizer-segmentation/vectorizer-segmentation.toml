key = "4ddf3164d5e92df4"
type = "list"
composite = true
origin = '''
{{4ddf3164d5e92df4-c8438b851a0e833a}}
{{4ddf3164d5e92df4-a438a28859437a28}}
'''
translate = '''
{{4ddf3164d5e92df4-c8438b851a0e833a}}
{{4ddf3164d5e92df4-a438a28859437a28}}
'''

