[[block]]
key = "259eaf54e74f0e21"
type = "heading"
origin = '''
## 启用描边与描边宽度
'''
translate = '''
## Enable Stroke and Stroke Width
'''

[[block]]
key = "b3ed2a78db493b04"
type = "paragraph"
origin = '''
开启“启用描边”后，每条 SVG 路径在输出填充色的同时会附带同色描边。描边宽度范围为 `0–20`，默认值为 `0.5`：
'''
translate = '''
When **Enable Stroke** is on, each SVG path is exported with a matching stroke alongside its fill. **Stroke Width** ranges from `0–20` and defaults to `0.5`:
'''

[[block]]
key = "91102e94910df9bb"
type = "list"
composite = true
origin = '''
{{91102e94910df9bb-c6c13dad45d7a0ee}}
{{91102e94910df9bb-c97836f89711f684}}
'''
translate = '''
{{91102e94910df9bb-c6c13dad45d7a0ee}}
{{91102e94910df9bb-c97836f89711f684}}
'''

[[block]]
key = "91102e94910df9bb-c6c13dad45d7a0ee"
type = "listItem"
composite = true
origin = '''
- {{91102e94910df9bb-c6c13dad45d7a0ee-3733b5b4b6a9fbe7}}
'''
translate = '''
- {{91102e94910df9bb-c6c13dad45d7a0ee-3733b5b4b6a9fbe7}}
'''

[[block]]
key = "91102e94910df9bb-c6c13dad45d7a0ee-3733b5b4b6a9fbe7"
type = "paragraph"
origin = '''
**适度调大宽度**：让相邻路径边缘轻微重叠，消除浏览器缩放或渲染时常见的抗锯齿白缝；
'''
translate = '''
**Moderate values** overlap neighboring paths slightly, hiding hairline white seams during rendering or scaling.
'''

[[block]]
key = "91102e94910df9bb-c97836f89711f684"
type = "listItem"
composite = true
origin = '''
- {{91102e94910df9bb-c97836f89711f684-9c56dd50fa29dab4}}
'''
translate = '''
- {{91102e94910df9bb-c97836f89711f684-9c56dd50fa29dab4}}
'''

[[block]]
key = "91102e94910df9bb-c97836f89711f684-9c56dd50fa29dab4"
type = "paragraph"
origin = '''
**宽度过大**：描边会向外扩张侵占邻近色块，导致细小结构变粗。
'''
translate = '''
**Excessive values** expand strokes into neighboring regions and thicken fine details.
'''

[[block]]
key = "dd223226e591e6ae"
type = "paragraph"
origin = '''
关闭“启用描边”后，“描边宽度”滑块随之隐藏，导出的 SVG 仅保留纯填充路径。
'''
translate = '''
Turning **Enable Stroke** off hides **Stroke Width** and exports fill-only SVG paths.
'''

[[block]]
key = "343420fbb660a0e2"
type = "heading"
origin = '''
## 薄线检测半径
'''
translate = '''
## Thin Line Max Radius
'''

[[block]]
key = "af229d5db2f0aa23"
type = "paragraph"
origin = '''
取值范围为 `0.5–10 px`，默认值为 `2.5 px`。引擎通过距离变换识别半径不超过该值的狭长线条，并在分割与拟合阶段优先保留其连通结构：
'''
translate = '''
Ranges from `0.5–10 px`, with a default of `2.5 px`. Using a distance transform, the vectorizer identifies narrow strokes up to this radius and protects them from breaking apart during segmentation and fitting:
'''

[[block]]
