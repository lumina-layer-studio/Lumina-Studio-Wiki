'''

[[block]]
key = "807675026cb39b87-387620f7aac8ee74-36971fe10fc7aa49"
type = "paragraph"
origin = '''
**数值过小**：极细线条容易在平滑或过滤中断裂遗漏；
'''
translate = '''
**Too low**: delicate linework may drop out or fragment.
'''

[[block]]
key = "807675026cb39b87-56d316646d64e984"
type = "listItem"
composite = true
origin = '''
- {{807675026cb39b87-56d316646d64e984-6c2ad1805fe8e94b}}
'''
translate = '''
- {{807675026cb39b87-56d316646d64e984-6c2ad1805fe8e94b}}
'''

[[block]]
key = "807675026cb39b87-56d316646d64e984-6c2ad1805fe8e94b"
type = "paragraph"
origin = '''
**数值过大**：更多普通狭窄色块也会被当作细线特殊保留。
'''
translate = '''
**Too high**: ordinary narrow regions may also be treated as thin-line features.
'''

[[block]]
key = "a1de81b9f8305ae6"
type = "paragraph"
origin = '''
此处的 `px` 指内部工作分辨率下的像素半径，而非 3D 打印成品的毫米线宽。
'''
translate = '''
This radius is measured in pixels on the internal working image, not in millimeters on the printed model.
'''

[[block]]
key = "21da47bd7ffac4e9"
type = "heading"
origin = '''
## 启用覆盖修复与最小覆盖率
'''
translate = '''
## Enable Coverage Fix and Min Coverage Ratio
'''

[[block]]
key = "6e8a7cde05cf12cf"
type = "paragraph"
origin = '''
开启“启用覆盖修复”后，引擎会在轮廓追踪结束时检测整幅画布的像素覆盖比例。一旦实际覆盖率低于“最小覆盖率”，系统便会自动补齐路径间遗漏的空隙像素。
'''
translate = '''
When **Enable Coverage Fix** is enabled, the engine measures total canvas coverage after contour tracing. Whenever coverage falls below **Min Coverage Ratio**, it patches uncovered pixels to seal tiny gaps between regions.
'''

[[block]]
key = "53c14cc88fe182c0"
type = "paragraph"
origin = '''
“最小覆盖率”取值范围为 `0–1`，默认值为 `0.998`。数值越接近 `1`，越容易触发缝隙修补。
'''
translate = '''
**Min Coverage Ratio** ranges from `0–1`, with a default of `0.998`. Values closer to `1` trigger gap patching more readily.
'''

[[block]]
key = "fe9fda8da440bcc5"
type = "paragraph"
origin = '''
该选项专门针对路径交界处的微米级漏白；若色块边界轮廓本身的走势不准确，请优先调整[超像素分割与抗锯齿检测](../vectorizer-segmentation/vectorizer-segmentation.mdx)或[曲线拟合与区域过滤](../vectorizer-curve-and-filtering/vectorizer-curve-and-filtering.mdx)中的参数。
'''
translate = '''
Coverage repair is designed specifically to close tiny inter-path gaps. If the shape boundaries themselves follow the wrong contours, adjust [Superpixel Segmentation and Antialiasing](../vectorizer-segmentation/vectorizer-segmentation.mdx) or [Curve Fitting and Region Filtering](../vectorizer-curve-and-filtering/vectorizer-curve-and-filtering.mdx) first.
'''

