[[block]]
key = "d4e9c55bfaba16dc"
type = "heading"
origin = '''
# LUT 颜色网格
'''
translate = '''
# LUT Color Grid
'''

[[block]]
key = "2d4c963cb2e6ef04"
type = "paragraph"
origin = '''
使用传统 LUT 完成预览后，颜色工作站右栏会加载该 LUT 可输出的全部颜色，并分为**图中使用**与**其他可用**两组展示。先在左侧选中源色后，面板顶部会列出按 RGB 色差由近到远排序的 12 个**推荐替换色**。
'''
translate = '''
After previewing with a Legacy LUT, the right column of Color Workstation loads every color that LUT can produce, grouped into **Used in image** and **Other available**. Selecting a source color on the left adds **Recommended Replacements (12)** at the top, ranked by RGB distance.
'''

[[block]]
key = "a74e40ccab9d6834"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/01-lut-grid.webp').default}
  alt="显示推荐替换色、图中使用色和其他可用色的 LUT 颜色网格"
/>
'''
translate = '''
<img
  src={require('./assets/01-lut-grid.webp').default}
