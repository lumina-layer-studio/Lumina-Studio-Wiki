origin = '''
### 设为 0 可以关闭暗色保护吗？
'''
translate = '''
'''

[[block]]
key = "9bc87c1742100e11"
type = "paragraph"
origin = '''
不可以。**0** 是“所有暗部像素均进入暗色保护分支”的特殊值；如需关闭暗色保护，请直接关闭“色相保护”。
'''
translate = '''
'''
