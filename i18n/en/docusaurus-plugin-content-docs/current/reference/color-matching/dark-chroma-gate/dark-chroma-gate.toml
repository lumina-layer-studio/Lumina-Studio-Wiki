origin = '''
## 彩度筛选原理
'''
translate = '''
## How chroma filtering works
'''

[[block]]
key = "46c91e1af0319a2d"
type = "paragraph"
origin = '''
匹配前，Lumina Studio 会将原图像素转换至 CIELAB/LCh 颜色空间：
'''
translate = '''
Lumina Studio converts each source color into the CIELAB/LCh color space:
'''

[[block]]
key = "b7d40b5d97c7e3d9"
type = "list"
composite = true
origin = '''
{{b7d40b5d97c7e3d9-7e827d17c8c5abbd}}
{{b7d40b5d97c7e3d9-cc35704b4a0ed0ed}}
'''
translate = '''
- **L\*** measures lightness (lower values are darker).
- **C** measures chroma (lower values are closer to neutral black, white, or gray; higher values carry stronger color).
'''

[[block]]
key = "b7d40b5d97c7e3d9-7e827d17c8c5abbd"
type = "listItem"
composite = true
origin = '''
- {{b7d40b5d97c7e3d9-7e827d17c8c5abbd-fb7691392edc2741}}
'''
translate = '''
'''

[[block]]
key = "b7d40b5d97c7e3d9-7e827d17c8c5abbd-fb7691392edc2741"
type = "paragraph"
origin = '''
**L\*** 表示亮度，数值越低颜色越暗；
'''
translate = '''
'''

[[block]]
key = "b7d40b5d97c7e3d9-cc35704b4a0ed0ed"
type = "listItem"
composite = true
origin = '''
- {{b7d40b5d97c7e3d9-cc35704b4a0ed0ed-ddf23307f3ede9c6}}
'''
translate = '''
'''

[[block]]
key = "b7d40b5d97c7e3d9-cc35704b4a0ed0ed-ddf23307f3ede9c6"
type = "paragraph"
origin = '''
**C** 表示彩度，数值越低越接近黑、白、灰，数值越高色彩倾向越鲜明。
'''
translate = '''
'''

[[block]]
key = "dcb62eaa6bda606d"
type = "paragraph"
origin = '''
“暗色彩度门槛”直接与像素的彩度 **C** 比较。以默认值 **15** 为例：位于暗部亮度区间且满足 **C ≤ 15** 的像素会进入暗色保护分支；**C > 15** 的像素则继续按常规色相优先规则匹配。
'''
translate = '''
At the default value of **15**, dark pixels with **C ≤ 15** enter the neutral-dark protection branch, while pixels with **C > 15** continue through standard hue-priority matching.
'''

[[block]]
key = "1e95589083a3352d"
type = "admonition"
composite = true
origin = '''
:::note[彩度与饱和度的区别]
{{1e95589083a3352d-6527fa106aa7872f}}
:::
'''
translate = '''
:::note[Chroma vs. Saturation]
Chroma (C) is calculated in CIELAB/LCh color space and differs from the HSV or HSL saturation percentage shown in image editors.
:::
'''

[[block]]
key = "1e95589083a3352d-6527fa106aa7872f"
type = "paragraph"
origin = '''
此处的彩度 C 在 CIELAB/LCh 颜色空间中计算，不同于修图软件常见的 HSV/HSL“饱和度”百分比。
'''
translate = '''
'''

[[block]]
key = "6436c91bd7ccbff5"
type = "heading"
origin = '''
## 亮度分段与匹配逻辑
'''
translate = '''
## Lightness bands and matching behavior
'''

[[block]]
key = "090183e09193b4cb"
type = "paragraph"
origin = '''
开启色相保护后，系统会先从当前 LUT 中筛选出一组“无彩暗色候选”（亮度约低于 **L\* 60**、彩度 **C ≤ 8**），再结合原图像素的亮度区间决定匹配方式：
'''
translate = '''
Hue Protection first collects neutral dark candidates from the active LUT—colors below roughly **L\* 60** with **C ≤ 8**—and applies the gate across three fixed lightness bands:
'''

[[block]]
key = "e2f7d35362624010"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/02-dark-chroma-gate-logic.webp').default}
  alt="暗色彩度门槛在当前颜色匹配流程中的判断逻辑示意图"
/>
'''
translate = '''
'''

[[block]]
key = "7c4e612121b12564"
type = "table"
origin = '''
| 原图像素亮度 | 满足彩度门槛时的匹配方式 |
| --- | --- |
| 约 **L\* < 50** | 直接从无彩暗色候选中择优匹配 |
| 约 **L\* 50–70** | 在无彩暗色候选与常规候选之间平滑过渡 |
| 约 **L\* ≥ 70** | 不进入暗色保护分支，保持常规色相优先匹配 |
'''
translate = '''
| Source lightness | Behavior when passing the chroma gate |
| --- | --- |
| Approx. **L\* < 50** | Matches exclusively against neutral-dark candidates |
| Approx. **L\* 50–70** | Blends smoothly between neutral-dark and standard candidates |
| Approx. **L\* ≥ 70** | Bypasses the dark branch and uses standard hue-priority matching |
'''

[[block]]
key = "eb03f36c85dfc9db"
type = "paragraph"
origin = '''
上述亮度分界固定不变，拖动“暗色彩度门槛”只改变允许进入暗色保护分支的彩度上限。
'''
translate = '''
Adjusting **Dark Chroma Gate** changes the maximum chroma eligible for this branch without moving the lightness cutoffs above.
'''

[[block]]
key = "a9b82c6eef4af63a"
type = "heading"
origin = '''
## 数值方向与效果对比
'''
translate = '''
## Adjusting the value
'''

[[block]]
key = "3e2063f5bcfd1b55"
type = "paragraph"
origin = '''
数值越大，允许进入无彩暗色保护分支的暗部彩度越宽（但 `0` 为全开特殊值）：
'''
translate = '''
'''

[[block]]
key = "9b2f890d2667422c"
type = "table"
origin = '''
| 设置值 | 作用规则 | 画面表现 |
| --- | --- | --- |
| **0** | 特殊值：暗部亮度区间内的所有像素均进入暗色保护分支 | 黑灰描边最干净，但深红、深蓝等有彩暗部也容易被压成黑灰 |
| **低于 15** | 仅极低彩度的近黑灰像素进入暗色保护分支 | 有彩暗部保留更完整，但黑灰区域可能重新混入邻近耗材色偏 |
| **15** | 默认值 | 兼顾黑灰纯净度与暗部色彩，适合作为调节起点 |
| **高于 15** | 允许带一定色彩倾向的暗部也进入无彩暗色匹配 | 进一步抑制黑灰描边杂色，但较深的彩色阴影可能变灰 |
| **50** | 最大常规门槛 | 覆盖高彩度暗部，适合排查杂色是否源自暗部匹配分支 |
'''
translate = '''
| Value | Behavior | Visual effect |
| --- | --- | --- |
| **0** | Special value: routes all pixels in the dark lightness range into the neutral-dark branch | Strongest protection for black and gray linework, but pushes dark reds, blues, and greens toward black or gray |
| **Below 15** | Restricts the branch to nearly neutral dark pixels | Preserves rich colored shadows, though black or gray areas may pick up slight color casts |
| **15** | Default baseline | Balanced starting point for most illustrations and photos |
| **Above 15** | Admits dark pixels with higher chroma into the neutral-dark branch | Cleans up colored speckles in dark linework, at the risk of desaturating deep colored shadows |
| **50** | Widest threshold | Useful for testing whether unwanted casts originate in the dark-matching branch |
'''

