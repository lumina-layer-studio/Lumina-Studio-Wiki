'''

[[block]]
key = "f68854b8fd0d74c1"
type = "heading"
origin = '''
### 调整数值后预览为什么没有变化？
'''
translate = '''
'''

[[block]]
key = "4fb371171e1213e3"
type = "paragraph"
origin = '''
请先确认“色相保护”处于开启状态并已重新生成预览。若原图本身缺少暗部区域、当前 LUT 中没有符合条件的无彩暗色候选，或当前颜色来源为耗材档案，调整滑块均不会改变画面。
'''
translate = '''
'''

[[block]]
key = "985eff02b4e873dc"
type = "heading"
origin = '''
### 为什么调高数值后彩色阴影变灰了？
'''
translate = '''
'''

[[block]]
key = "7cb5b18688c0b940"
type = "paragraph"
origin = '''
门槛调高后，原本带有色相的深色像素也被归入无彩暗色候选池。将门槛逐步调低，即可恢复深红、深蓝或深绿暗部。
'''
translate = '''
