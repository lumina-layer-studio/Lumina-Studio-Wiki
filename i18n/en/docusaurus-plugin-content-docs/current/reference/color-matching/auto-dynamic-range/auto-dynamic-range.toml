[[block]]
key = "d8f58636ceecb989"
type = "yaml"
origin = '''
---
title: "自动动态范围"
description: "按当前 LUT 或耗材档案的可达亮度范围自动压缩原图明度，改善极亮高光与极暗阴影的层次还原。"
sidebar_position: 3
---
'''
translate = '''
---
title: "Auto Dynamic Range"
description: "Compress source image lightness into the reachable L* range of the active LUT or Material Archive to preserve highlight and shadow detail."
sidebar_position: 3
---
'''

[[block]]
key = "3e1490864b8185f2"
type = "heading"
origin = '''
# 自动动态范围
'''
translate = '''
# Auto Dynamic Range
'''

[[block]]
key = "e45cba8d0a6614d1"
type = "paragraph"
origin = '''
“自动动态范围（实验性功能）”会在颜色量化和配方匹配之前，将原图亮度压缩到当前 LUT 或耗材档案可表达的亮度区间内，适合原图明暗跨度超出耗材实际表现范围的场景。
'''
translate = '''
**Auto Dynamic Range (Experimental)** compresses source image lightness into the brightness range reproducible by the active LUT or Material Archive before color quantization and recipe matching. Use it when an image spans brighter highlights or deeper shadows than your loaded filaments can physically produce.
'''

[[block]]
key = "e7ae7b3be5eb67fe"
type = "paragraph"
origin = '''
此项默认关闭。
'''
translate = '''
This option is off by default.
'''

[[block]]
key = "0ef779c18ec11294"
type = "heading"
origin = '''
## 控件位置
'''
translate = '''
## Location
'''

[[block]]
key = "d87bd84d9dc4548e"
type = "paragraph"
origin = '''
依次打开“图像转换 → 核心设置 → 高级设置”，即可找到“自动动态范围（实验性功能）”。
'''
translate = '''
Open **Converter → Core Settings → Advanced Settings**, then locate **Auto Dynamic Range (Experimental)**.
'''

