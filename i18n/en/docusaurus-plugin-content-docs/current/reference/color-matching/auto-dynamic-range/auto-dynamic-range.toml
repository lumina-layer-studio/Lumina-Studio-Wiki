[[block]]
key = "6aa7ffcd3353f03d-b7321c0bbe304730-d3fdec47acff93af"
type = "paragraph"
origin = '''
对暗部与高光应用平滑的缓入、缓出曲线，轻度压缩时保持中间调斜率不变。
'''
translate = '''
Applies smooth toe and shoulder curves to shadows and highlights, preserving the midtone slope under mild compression.
'''

[[block]]
key = "6aa7ffcd3353f03d-ba2fcbbb74c223bd"
type = "listItem"
composite = true
origin = '''
5. {{6aa7ffcd3353f03d-ba2fcbbb74c223bd-1ee058b2344e011f}}
'''
translate = '''
5. {{6aa7ffcd3353f03d-ba2fcbbb74c223bd-1ee058b2344e011f}}
'''

[[block]]
key = "6aa7ffcd3353f03d-ba2fcbbb74c223bd-1ee058b2344e011f"
type = "paragraph"
origin = '''
保持 a\*、b\* 色度通道不变，随后进入颜色量化与配方匹配。
'''
translate = '''
Preserves the a\* and b\* chroma channels, then proceeds to color quantization and recipe matching.
'''

[[block]]
key = "8660fe2e6e310cb5"
type = "paragraph"
origin = '''
该压缩采用柔和的曲线过渡：轻度压缩主要收拢暗部与高光两端；当目标亮度范围明显收窄时，中间调对比度也会相应降低，以换取两端细节不丢失。
'''
translate = '''
Rather than applying a flat linear fade toward gray, mild compression rolls in the extremes while keeping midtones intact. When a much narrower target range requires stronger compression, midtone contrast scales down proportionally so shadow and highlight gradation remains distinguishable.
'''

[[block]]
key = "783e8a499f0e4ed3"
