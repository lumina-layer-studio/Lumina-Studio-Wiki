origin = '''
仅当目标可达范围窄于原图亮度范围时执行压缩。
'''
translate = '''
Compresses lightness only when the target range is narrower than the source range.
'''

[[block]]
key = "6aa7ffcd3353f03d-b7321c0bbe304730"
type = "listItem"
composite = true
origin = '''
4. {{6aa7ffcd3353f03d-b7321c0bbe304730-d3fdec47acff93af}}
'''
