[[block]]
key = "0aa8fb9242912c21"
type = "heading"
origin = '''
## 清理规则
'''
translate = '''
## How cleanup works
'''

[[block]]
key = "e4eea260bc3b344c"
type = "paragraph"
origin = '''
清理在像素完成材料配方匹配之后执行。系统会逐像素检查周围最多 8 个相邻像素（图像边缘与四角按实际存在的邻居计算）：
'''
translate = '''
Cleanup runs after pixels have been matched to printable material recipes. For each pixel, Lumina Studio inspects up to eight surrounding neighbors (edge and corner pixels are checked against their existing neighbors):
'''

[[block]]
key = "24f01f2c9460a40f"
type = "list"
composite = true
origin = '''
{{24f01f2c9460a40f-921817cf06d03f2d}}
{{24f01f2c9460a40f-a3222ae7e475c3e5}}
{{24f01f2c9460a40f-73196b7ee02a5002}}
{{24f01f2c9460a40f-3f2525f134b76308}}
'''
translate = '''
1. Compares the complete **material layer stack**, not just the on-screen RGB color.
2. Marks the pixel as isolated only if its stack differs from every valid neighbor.
3. Identifies the most frequent material stack among those neighbors.
4. Copies both the material stack and the matched color from a neighbor with that winning stack.
'''

[[block]]
key = "24f01f2c9460a40f-921817cf06d03f2d"
type = "listItem"
composite = true
origin = '''
1. {{24f01f2c9460a40f-921817cf06d03f2d-4c69fcca9fd3c5e1}}
'''
translate = '''
'''

[[block]]
key = "24f01f2c9460a40f-921817cf06d03f2d-4c69fcca9fd3c5e1"
type = "paragraph"
origin = '''
按整套**材料层堆叠配方**进行比对，而非仅比较屏幕显示的 RGB 颜色。
'''
translate = '''
'''

[[block]]
key = "24f01f2c9460a40f-a3222ae7e475c3e5"
type = "listItem"
composite = true
origin = '''
2. {{24f01f2c9460a40f-a3222ae7e475c3e5-0d5016607953a730}}
'''
translate = '''
'''

[[block]]
key = "24f01f2c9460a40f-a3222ae7e475c3e5-0d5016607953a730"
type = "paragraph"
origin = '''
仅当当前像素的材料堆叠与周围所有有效邻居均不相同，才将其标记为孤立点。
'''
translate = '''
'''

[[block]]
key = "24f01f2c9460a40f-73196b7ee02a5002"
type = "listItem"
composite = true
origin = '''
3. {{24f01f2c9460a40f-73196b7ee02a5002-c3ce2bc71d03376c}}
'''
translate = '''
'''

[[block]]
key = "24f01f2c9460a40f-73196b7ee02a5002-c3ce2bc71d03376c"
type = "paragraph"
origin = '''
统计周围邻居中出现频次最高的材料堆叠。
'''
translate = '''
'''

[[block]]
key = "24f01f2c9460a40f-3f2525f134b76308"
type = "listItem"
composite = true
origin = '''
4. {{24f01f2c9460a40f-3f2525f134b76308-57b032fbb4cbe691}}
'''
translate = '''
'''

[[block]]
key = "24f01f2c9460a40f-3f2525f134b76308-57b032fbb4cbe691"
type = "paragraph"
origin = '''
直接复制该常见邻居的材料堆叠与匹配颜色完成替换。
'''
translate = '''
'''

[[block]]
key = "804d9db0fe392e7d"
type = "paragraph"
origin = '''
由于替换配方直接取自相邻像素，清理过程始终复用调色板内已有的合法配方，不会生成调色板之外的新颜色。
'''
translate = '''
Because replacements are copied directly from neighboring pixels, cleanup always reuses valid recipes already present in the image and never introduces out-of-palette colors.
'''

[[block]]
key = "8e6e56700e1db8c8"
type = "heading"
origin = '''
## 保留范围与成片碎点排查
'''
translate = '''
## What stays untouched
'''

[[block]]
key = "24740cbf96a054e5"
type = "paragraph"
origin = '''
以下结构不属于严格单像素孤立点，清理时会完整保留：
'''
translate = '''
'''

[[block]]
key = "138bab714a402907"
type = "list"
composite = true
origin = '''
{{138bab714a402907-2cb42eadc0865e98}}
{{138bab714a402907-aced7053fba59e80}}
'''
translate = '''
- Clusters of two or more connected pixels sharing the same stack are preserved.
- Fine lines, outlines, and small details remain intact whenever at least one adjacent pixel shares the same stack.
'''

[[block]]
key = "138bab714a402907-2cb42eadc0865e98"
type = "listItem"
composite = true
origin = '''
- {{138bab714a402907-2cb42eadc0865e98-9b04e40c0d122529}}
'''
translate = '''
'''

[[block]]
key = "138bab714a402907-2cb42eadc0865e98-9b04e40c0d122529"
type = "paragraph"
origin = '''
两个及以上相连且同配方的像素块；
'''
translate = '''
'''

[[block]]
key = "138bab714a402907-aced7053fba59e80"
type = "listItem"
composite = true
origin = '''
- {{138bab714a402907-aced7053fba59e80-a3e6ac0d01be5453}}
'''
translate = '''
'''

[[block]]
key = "138bab714a402907-aced7053fba59e80-a3e6ac0d01be5453"
type = "paragraph"
origin = '''
至少与一个相邻像素共用同一材料堆叠的细线、轮廓与微小色块。
'''
translate = '''
'''

[[block]]
key = "e92a03b0c3fc9d73"
type = "paragraph"
origin = '''
若开启后画面仍存在成片噪点或细碎色块，建议结合[量化颜色数](../../converter-basic/quantize-colors/quantize-colors.mdx)、原图降噪以及目标打印尺寸一并调整。
'''
translate = '''
If noticeable speckling or color chatter remains, check [Quantize Colors](../../converter-basic/quantize-colors/quantize-colors.mdx), source image noise, and your target print dimensions.
'''

[[block]]
key = "319a5114d3fa7cdf"
type = "heading"
origin = '''
## 生效范围
'''
translate = '''
## Supported workflows
'''

[[block]]
key = "fa515ead368e2840"
type = "paragraph"
origin = '''
传统 LUT、预测匹配与耗材档案的位图像素流程均采用这套邻居配方清理规则；原生 SVG 矢量路径直接按图形对象匹配颜色，不经过单像素清理。
'''
translate = '''
Standard LUT, predictive matching, and Material Archive pixel pipelines all apply this neighbor-copy rule. Native SVG vector shapes are matched per vector object and bypass single-pixel cleanup.
'''

[[block]]
key = "0d3d6cf69da7d208"
type = "paragraph"
origin = '''
切换开关后，此前生成的预览与 3MF 文件将失效，请重新生成预览和模型以查看变化。Lumina 配方卡会保存该开关状态。
'''
translate = '''
Toggling this option clears any previously generated preview and 3MF output—rebuild both to compare results. Lumina recipe cards save this setting.
'''

