[[block]]
key = "ff183316feea1aea"
type = "heading"
origin = '''
# 孤立像素清理
'''
translate = '''
# Isolated Pixel Cleanup
'''

[[block]]
key = "9e4a70e989ff81be"
type = "paragraph"
origin = '''
“孤立像素清理”用于消除颜色匹配后残留的严格单像素杂点。只有当某个像素的整套材料堆叠与周围所有相邻像素均不同时，系统才会将其判定为孤立点并替换为周围最常见的材料配方，不会模糊整体画面或磨平正常边缘。
'''
translate = '''
**Isolated Pixel Cleanup** removes strict single-pixel recipe outliers after color matching. Instead of blurring the image or softening edges, it replaces a pixel only when its complete material stack differs from every surrounding neighbor.
'''

[[block]]
key = "d1f5964c9cda7aee"
type = "paragraph"
origin = '''
此项默认开启。
'''
translate = '''
This option is enabled by default.
'''

[[block]]
key = "0ef779c18ec11294"
type = "heading"
origin = '''
## 控件位置
'''
translate = '''
## Location
'''

[[block]]
key = "6da68e6e420b15d9"
type = "paragraph"
origin = '''
依次打开“图像转换 → 核心设置 → 高级设置”，即可找到“孤立像素清理”。
'''
translate = '''
Open **Converter → Core Settings → Advanced Settings**, then locate **Isolated Pixel Cleanup**.
'''

