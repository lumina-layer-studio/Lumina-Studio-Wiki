[[block]]
key = "0aecd2f84805b3e9"
type = "heading"
origin = '''
# 解锁量化颜色数
'''
translate = '''
# Unlock Quantize Ceiling
'''

[[block]]
key = "6aa734863e125661"
type = "paragraph"
origin = '''
“解锁量化颜色数”用于将[量化颜色数](../../converter-basic/quantize-colors/quantize-colors.mdx)滑块的调节上限从 **256** 扩展至 **8192**。开启开关本身不会立即重新量化图像，也不会自动改动当前已设定的颜色数。
'''
translate = '''
**Unlock Quantize Ceiling** raises the upper limit of the [Quantize Colors](../../converter-basic/quantize-colors/quantize-colors.mdx) slider from **256** to **8192**. Flipping the toggle does not re-quantize the image or change your current slider value until you move the slider above **256**.
'''

[[block]]
key = "e7ae7b3be5eb67fe"
type = "paragraph"
origin = '''
此项默认关闭。
'''
translate = '''
This option is off by default.
'''

[[block]]
key = "0ef779c18ec11294"
type = "heading"
origin = '''
## 控件位置
'''
translate = '''
## Location
'''

[[block]]
key = "5690fc9c2c069891"
type = "paragraph"
origin = '''
依次打开“图像转换 → 核心设置 → 高级设置”，即可找到“解锁量化颜色数”。
'''
translate = '''
Open **Converter → Core Settings → Advanced Settings**, then locate **Unlock quantize ceiling**.
'''

