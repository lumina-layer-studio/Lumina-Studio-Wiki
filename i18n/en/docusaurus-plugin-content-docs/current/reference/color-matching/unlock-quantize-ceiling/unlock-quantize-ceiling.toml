[[block]]
key = "10f323034b42d34b"
type = "heading"
origin = '''
## 取值范围变化
'''
translate = '''
## Slider range
'''

[[block]]
key = "dcd030ad9c5686d7"
type = "table"
origin = '''
| 开关状态 | 量化颜色数范围 | 步长 |
| --- | ---: | ---: |
| 关闭 | 8–256 | 8 |
| 开启 | 8–8192 | 8 |
'''
translate = '''
| Toggle state | Quantize Colors range | Step |
| --- | ---: | ---: |
| Off | 8–256 | 8 |
| On | 8–8192 | 8 |
'''

[[block]]
key = "e66492dbe53e654c"
type = "paragraph"
origin = '''
量化颜色数的默认值为 **48**。开启解锁后，只有手动将滑块拖到 **256** 以上，实际颜色预算才会随之增加；再次关闭解锁时，若当前数值高于 **256**，系统会自动将其回调至 **256**。
'''
translate = '''
The default **Quantize Colors** value is **48**. If you raise the slider past **256** and later turn **Unlock quantize ceiling** off, Lumina Studio immediately clamps the value back to **256**.
'''

[[block]]
key = "13994fa582ce88d5"
