[[block]]
key = "3b30b685be5af364"
type = "heading"
origin = '''
## 常见问题
'''
translate = '''
## Checking the result
'''

[[block]]
key = "baaedc62ef520149"
type = "heading"
origin = '''
### 开启后为什么画面没有变化？
'''
translate = '''
'''

[[block]]
key = "a93e9b1f6c2c91ba"
type = "paragraph"
origin = '''
请先确认已重新生成预览。若原图以黑白灰或低彩度色彩为主、常规匹配本就选中了同色相候选，或当前 LUT 与耗材档案中没有更接近目标色相的配方，结果都会保持不变。
'''
translate = '''
'''

[[block]]
key = "1de966482fde4026"
type = "heading"
origin = '''
### 开启后色相准了，但明暗略有变化，正常吗？
'''
translate = '''
'''

[[block]]
key = "be2e696b057ae7c8"
type = "paragraph"
origin = '''
正常。在有限的耗材叠层候选下，优先锁定色相有时需要牺牲少许亮度或彩度匹配度。若画面整体对明暗层次更敏感，可关闭色相保护回到常规匹配。
'''
translate = '''
Inspect both key subject colors and surrounding highlights, shadows, and gradients before and after enabling the toggle. When finite recipes force a trade-off, tighter hue accuracy can slightly shift local lightness. Once the preview looks right, generate a fresh 3MF file before slicing—previously exported 3MF files do not update automatically.
'''
