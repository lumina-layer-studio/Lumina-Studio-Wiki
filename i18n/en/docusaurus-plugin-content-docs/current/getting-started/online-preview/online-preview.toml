[[block]]
key = "9315a1aafe3704de"
type = "heading"
origin = '''
# 在线预览与导出额度
'''
translate = '''
# Online Preview and Export Allowance
'''

[[block]]
key = "124ae6cd3f659c25"
type = "paragraph"
origin = '''
打开 [Lumina Studio 在线预览站](https://test.luminastudio.com.cn/)，无需登录即可上传图片、调整配色并导出模型。在线站的计算在服务端完成；导出后下载 3MF，再用本机切片软件打开。
'''
translate = '''
Open the [Lumina Studio online preview site](https://test.luminastudio.com.cn/) to upload an image, adjust its palette and export a model without signing in. Calculations run on the service. Download the resulting 3MF and open it in your local slicer.
'''

[[block]]
key = "56be106cc1ab3e4b"
type = "heading"
origin = '''
## 每日额度怎样计算
'''
translate = '''
## How the daily allowance works
'''

[[block]]
key = "664e5c9af745e685"
type = "table"
origin = '''
| 使用方式 | 每日新图导出额度 |
| --- | --- |
| 免登录试用 | 3 张不同原图 |
| 连接 Lumina 社区账号 | 免登录 3 张 + 额外赠送 3 张，共 6 张不同原图 |
'''
translate = '''
| Access | Daily allowance for new-image exports |
| --- | --- |
| Without signing in | 3 distinct source images |
| With a connected Lumina community account | 3 anonymous + 3 additional exports: 6 distinct source images in total |
'''

[[block]]
key = "4cd97803e1f98537"
type = "paragraph"
origin = '''
免登录额度按同一 IP 统计。计数对象是**成功导出的不同原图**，不是点击按钮的次数：同一张图调整参数后反复导出，不重复消耗新图额度；生成失败和排队等待也不扣新图次数。
'''
translate = '''
The anonymous allowance is counted per IP address. It counts **distinct source images successfully exported**, not button presses. Re-exporting the same image after adjusting settings does not use another new-image slot; failed generation and queued requests do not consume one either.
'''

[[block]]
key = "72e2e53313076a0f"
type = "paragraph"
origin = '''
页面会显示当天剩余额度与恢复时间，时间按北京时间计算。多人共用同一网络出口时，可能共用免登录额度。耗尽后可等待恢复，或改用本地桌面版继续制作。
'''
translate = '''
The page displays the remaining allowance and reset time in China Standard Time (UTC+8). People sharing an internet connection may share the anonymous allowance. Once it is used up, wait for the reset or continue working in the local desktop edition.
'''

[[block]]
key = "5d43802f254c7672"
type = "heading"
origin = '''
## 连接社区账号
'''
translate = '''
## Connect a community account
'''

[[block]]
key = "6a830511b459eca8"
type = "paragraph"
origin = '''
在在线站右下角状态卡点击 **“登录 Lumina 账号 · 再享 +3 张/天”**，也可从耗材／LUT 库的社区账号入口连接。按登录页提示完成验证，核对网页与 Studio 显示的 **10 位一次性连接码**，确认账号正确后允许连接。连接成功当天即可在免登录 3 张新图的基础上，再获赠 3 张新图额度，合计每天 6 张。反复登录不会重复赠送额度。
'''
translate = '''
In the bottom-right status card, choose the Lumina sign-in button offering **+3 new images per day**. You can also connect through the community-account entry in the material or LUT library. Follow the sign-in verification steps, check that the **10-character one-time connection code** matches the one in Studio, confirm the account and allow the connection. The additional 3 new-image exports become available that day, on top of the 3 anonymous exports: 6 per day in total. Signing in repeatedly does not grant the bonus again.
'''

[[block]]
key = "29e65535071672f4"
type = "paragraph"
origin = '''
**在线站已由服务端统一预装公开耗材与 LUT 库**。连接账号后，可直接在选择器中按个人点赞、收藏筛选预装资源，无需在网页端逐条下载安装。网页中的“下载到本地”会提示“公开耗材与色卡已在线预装”，不会将这些资源另存到你的电脑。
'''
translate = '''
**The online site's public material and LUT libraries are preinstalled on the server.** Once connected, use your likes and saved resources to filter the preinstalled items directly in the pickers; there is no need to download and install each item in the browser. The local-download action on the online site displays a notice that public materials and color charts are already preinstalled; it does not save those resources to your computer.
'''

[[block]]
key = "4b6dec57dfb272a5"
type = "paragraph"
origin = '''
如需按需下载云端资源到自己的私人库、管理本地耗材，或将自测校准结果“贡献到公共库”，请使用桌面版；“我的投稿”管理也在桌面版完成。账号连接与投稿步骤见[社区账号、收藏与投稿](../../reference/materials-and-recipes/community-resources/community-resources.mdx)。
'''
translate = '''
Use the desktop edition to download cloud resources on demand into your own private library, manage local materials or submit your calibration results with **Share to public library**. **My submissions** is also managed in the desktop edition. See [Community Account, Saved Resources and Submissions](../../reference/materials-and-recipes/community-resources/community-resources.mdx) for account connection and submission steps.
'''

