[[block]]
key = "84150841e4b96975"
type = "heading"
origin = '''
# 首次使用：配置切片软件、打印机与喷嘴
'''
translate = '''
# First Use: Configure Your Slicer, Printer, and Nozzle
'''

[[block]]
key = "6918ff5c32cab5c9"
type = "paragraph"
origin = '''
首次打开 Lumina Studio 时，请先按你的真实硬件配置切片软件、打印机型号与喷嘴尺寸。后续生成的 3MF 工程、打印盘尺寸与线宽尺度都会直接基于这三项设置计算。
'''
translate = '''
When you open Lumina Studio for the first time, set your slicer, printer model, and nozzle diameter to match your hardware. Lumina Studio uses these three settings to size build plates, compute pixel line scales, and generate compatible 3MF projects.
'''

[[block]]
key = "af4b89b8fbaf4cb1"
type = "blockquote"
composite = true
origin = '''
> {{af4b89b8fbaf4cb1-a5179de2d79f2102}}
'''
translate = '''
> Screenshots below show **BambuStudio**, **Bambu Lab P1S**, and a **0.4 mm** nozzle as examples—select the software and hardware you actually run.
'''

[[block]]
key = "af4b89b8fbaf4cb1-a5179de2d79f2102"
type = "paragraph"
origin = '''
下方截图以 **BambuStudio**、**Bambu Lab P1S** 和 **0.4 毫米**喷嘴为例，操作时请按你实际使用的软件和硬件选择。
'''
translate = '''
'''

