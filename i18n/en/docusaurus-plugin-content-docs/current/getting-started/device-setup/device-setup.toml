'''

[[block]]
key = "928fa259278cbbf2"
type = "heading"
origin = '''
### 6. 核对设置摘要
'''
translate = '''
### 6. Review the summary
'''

[[block]]
key = "f626a697ab39d167"
type = "paragraph"
origin = '''
在页面底部确认切片软件、打印机型号与喷嘴尺寸均准确无误。更改会自动立即保存，无需手动点击保存按钮。
'''
translate = '''
Check the summary bar at the bottom to confirm your slicer, printer model, and nozzle size. Changes are saved automatically—there is no separate Save button.

<img
  src={require('./assets/settings-device-en-06-check-summary.webp').default}
  alt="Check the equipment settings summary"
/>
'''

[[block]]
key = "3348ebe6c2554387"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/settings-device-zh-06-check-summary.webp').default}
  alt="核对设备设置摘要"
/>
'''
translate = '''
'''

[[block]]
key = "be2a309564cc0c91"
type = "paragraph"
origin = '''
后续如果更换了打印机、切片软件或喷嘴口径，请随时回到 **“设置”** 同步更新，再重新生成模型。
'''
translate = '''
Whenever you switch slicers, printers, or nozzles later on, update **Settings** first before generating new 3MF files.
'''

[[block]]
key = "3b30b685be5af364"
type = "heading"
origin = '''
## 常见问题
'''
translate = '''
## Troubleshooting
'''

[[block]]
key = "2e05935340049a58"
type = "heading"
origin = '''
### 列表中找不到我的打印机型号？
'''
translate = '''
### My printer is not listed
'''

[[block]]
key = "0882131d6dce8725"
type = "paragraph"
origin = '''
可选机型列表随所选切片软件变化，请先确认第 3 步选对了切片软件。如果核对后仍无对应型号，说明当前版本暂未内置该机型配置。
'''
translate = '''
Available printer profiles depend on the selected slicer—double-check Step 3 first. If your printer still does not appear, a built-in profile for that model is not yet included in your current build.
'''

[[block]]
key = "23c4b4be472e1261"
type = "heading"
origin = '''
### 为什么页面上没有“保存”按钮？
'''
translate = '''
### Why is there no Save button?
'''

[[block]]
key = "1da0c6bcc67407c1"
type = "paragraph"
origin = '''
设备配置在选择后即自动生效并持久保存，可以直接切回其他工作区继续使用。
'''
translate = '''
Selections take effect and persist immediately. Once the summary matches your setup, you can head straight back to the workspace.
'''
