## 配置步骤
'''
translate = '''
## Setup steps
'''

[[block]]
key = "2e3466fb55b2431f"
type = "heading"
origin = '''
### 1. 打开系统设置
'''
translate = '''
### 1. Open System Settings
'''

[[block]]
key = "9d38c395d28e1bf6"
type = "paragraph"
origin = '''
点击顶部导航栏右侧的 **“设置”**，进入系统设置页面。
'''
translate = '''
Click **Settings** in the top navigation bar.

<img
  src={require('./assets/settings-device-en-01-open-settings.webp').default}
  alt="Open Settings at the top of the page"
/>
'''

[[block]]
key = "e3b2cbfac329e47c"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/settings-device-zh-01-open-settings.webp').default}
  alt="点击页面顶部的设置"
/>
'''
translate = '''
'''

[[block]]
key = "c4eca2ccbc29268c"
type = "heading"
origin = '''
### 2. 展开切片软件列表
'''
translate = '''
### 2. Open the Slicer menu
'''

[[block]]
key = "6cbbb7f832695dc4"
type = "paragraph"
origin = '''
在“系统设置”中找到 **“切片软件”**，点击下拉菜单查看当前受支持的切片软件。
'''
translate = '''
Locate **Slicer** under System Settings and open the dropdown menu to see supported slicers.

<img
  src={require('./assets/settings-device-en-02-open-slicer.webp').default}
  alt="Open the slicer menu"
/>
'''

[[block]]
key = "d7a4b910cecce04a"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/settings-device-zh-02-open-slicer.webp').default}
  alt="打开切片软件下拉菜单"
/>
'''
translate = '''
'''

[[block]]
key = "c1db0899c8d722f4"
type = "heading"
origin = '''
### 3. 选择切片软件
'''
translate = '''
### 3. Select your slicer
'''

[[block]]
key = "80b9638e6c7e665f"
type = "paragraph"
origin = '''
在下拉列表中选择你日常使用的切片软件。
'''
