type = "paragraph"
origin = '''
安装 Git 并确认命令可用：
'''
translate = '''
Install Git and verify that it is available:
'''

[[block]]
key = "2c9681e20baea0d5"
type = "code"
origin = '''
```bash
git --version
```
'''
translate = '''
```bash
git --version
```
'''

