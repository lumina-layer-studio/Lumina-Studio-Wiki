2. {{92351db26c923c3f-92351db26c923c3f-9b7387eb9d3a059f}}
'''

[[block]]
key = "92351db26c923c3f-92351db26c923c3f-9b7387eb9d3a059f"
type = "paragraph"
origin = '''
克隆源码仓库并进入目录：
'''
translate = '''
Clone the repository and enter the project directory:
'''

[[block]]
key = "63525b353f1c3e76"
type = "code"
origin = '''
```bash
git clone https://github.com/lumina-layer-studio/Lumina-Studio-Wiki.git
cd Lumina-Studio-Wiki
```
'''
translate = '''
```bash
git clone https://github.com/lumina-layer-studio/Lumina-Studio-Wiki.git
cd Lumina-Studio-Wiki
```
'''

[[block]]
key = "f8617efe5df22233"
type = "heading"
origin = '''
### 2. Node.js 与 Corepack
'''
translate = '''
### 1.2 Node.js and Corepack
'''

[[block]]
key = "001700f65243df36"
type = "paragraph"
origin = '''
需要 Node.js 20 及以上版本与 Corepack。Node.js 14.19.0 至 24.x 自带 Corepack；从 Node.js 25 起不再默认附带。
'''
translate = '''
You need Node.js 20 or later and Corepack. Corepack is bundled with Node.js 14.19.0 through 24.x, and is no longer included starting with Node.js 25.
'''

[[block]]
key = "2b542569b65b7601"
type = "paragraph"
origin = '''
若系统提示找不到 `corepack`（如使用 Node.js 25 及以上版本），请先手动安装全局 Corepack，详见 [Corepack 官方安装说明](https://github.com/nodejs/corepack#how-to-install)：
'''
translate = '''
If `corepack` is not found (for example on Node.js 25 or later), install it globally first (see the [official Corepack installation guide](https://github.com/nodejs/corepack#how-to-install)):
'''

[[block]]
key = "8a9917ea97295a2e"
type = "code"
origin = '''
```bash
npm install -g corepack
```
'''
translate = '''
```bash
npm install -g corepack
```
'''

[[block]]
key = "1edc9e89e58c64fc"
type = "paragraph"
origin = '''
已内置或安装完成后，启用 Corepack：
'''
translate = '''
Enable Corepack:
'''

[[block]]
key = "193dde5bf36b4330"
type = "code"
origin = '''
```bash
corepack enable
```
'''
translate = '''
```bash
corepack enable
```
'''

[[block]]
key = "9b734c32c89e4572"
type = "paragraph"
origin = '''
随后安装项目依赖：
'''
translate = '''
Then install project dependencies:
'''

[[block]]
key = "bb54aa9608a3fb6e"
type = "code"
origin = '''
```bash
yarn install --immutable
```
'''
translate = '''
```bash
yarn install --immutable
```
'''

[[block]]
key = "149fabeda82d91e8"
type = "paragraph"
origin = '''
项目固定使用 `package.json` 中声明的 Yarn 4 版本。
'''
translate = '''
The repository pins the exact Yarn 4 version specified in `package.json`.
'''

[[block]]
key = "3cb9652d7abc8c18"
type = "heading"
origin = '''
## 二、本地预览
'''
translate = '''
## 2. Local preview
'''

[[block]]
key = "42357c304240f157"
type = "paragraph"
origin = '''
`yarn start` 默认仅启动中文站点预览：
'''
translate = '''
`yarn start` launches the Chinese site by default:
'''

[[block]]
key = "d073e98da6cb2b9e"
type = "code"
origin = '''
```bash
yarn start
```
'''
translate = '''
```bash
yarn start
```
'''

[[block]]
key = "38e1a88f89845e71"
type = "paragraph"
origin = '''
预览英文站点需显式指定语言参数：
'''
translate = '''
To preview the English site, pass the `--locale en` flag:
'''

[[block]]
key = "e145eff7417346a8"
type = "code"
origin = '''
```bash
yarn start --locale en
```
'''
translate = '''
```bash
yarn start --locale en
```
'''

[[block]]
key = "2abcf901a78508f1"
type = "paragraph"
origin = '''
中英文站点分别独立构建，且默认占用同一端口，因此**同一时间只能运行一种语言的预览服务**。切换语言前，请先按 `Ctrl+C` 停止当前服务，再执行另一条启动命令。
'''
translate = '''
Chinese and English build separately and share the same default port, so **only one locale can run at a time**. Press `Ctrl+C` to stop the active dev server before starting the other locale.
'''

[[block]]
key = "71e791c567a4f304"
type = "heading"
origin = '''
## 三、提交前检查
'''
translate = '''
## 3. Pre-submit checks
'''

[[block]]
key = "52825a4778b9ddf7"
type = "paragraph"
origin = '''
提交前请依次执行类型检查与完整构建：
'''
translate = '''
Run both checks in order before committing:
'''

[[block]]
key = "7c2a88260d370938"
type = "code"
origin = '''
```bash
yarn typecheck
yarn build
```
'''
translate = '''
```bash
yarn typecheck
yarn build
```
'''

[[block]]
key = "68406826d6da0440"
type = "heading"
origin = '''
