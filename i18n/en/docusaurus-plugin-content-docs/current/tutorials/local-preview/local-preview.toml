[[block]]
key = "308c9c6bd3f1f47a"
type = "heading"
origin = '''
# 本地预览与提交前检查
'''
translate = '''
# Local Preview and Pre-Submit Checks
'''

[[block]]
key = "b76449f7bba8fe23"
type = "paragraph"
origin = '''
本站基于 Docusaurus 构建，使用 `yarn` 管理依赖。修改文档后，请先在本地完成预览与构建检查，再提交 Pull Request。
'''
translate = '''
This documentation site is built with Docusaurus and managed with `yarn`. Run a local preview and both pre-submit checks before opening a pull request.
'''

[[block]]
key = "66081d8019bdd3b6"
type = "heading"
origin = '''
## 一、环境准备
'''
translate = '''
## 1. Environment setup
'''

[[block]]
key = "883e63f8e1a8c4de"
type = "heading"
origin = '''
### 1. Git 与源码仓库
'''
translate = '''
### 1.1 Git and the source repository
'''

[[block]]
key = "17b21e57c0b91d7c"
type = "paragraph"
origin = '''
本地预览与提交前检查均会读取仓库的 `.git` 历史记录。请使用 `git clone` 克隆仓库，切勿直接下载源码 ZIP 解压运行（普通解压目录缺少 `.git` 记录，会导致预览与构建报错）。
'''
translate = '''
Both local preview and pre-submit checks read the repository's `.git` history. Clone the repository with `git clone` rather than downloading a source ZIP archive, which lacks `.git` metadata and causes preview and build commands to fail.
'''

[[block]]
key = "e04a4d1b84eda600"
type = "list"
composite = true
origin = '''
{{e04a4d1b84eda600-e04a4d1b84eda600}}
'''
