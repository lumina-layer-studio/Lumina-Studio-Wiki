[[block]]
key = "26c2b625e29471bb"
type = "heading"
origin = '''
## 第四步：找到并打开 3MF
'''
translate = '''
## Step 4: Find and open the 3MF
'''

[[block]]
key = "d2bc1fd6589da9a6"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/04-zip-contents.webp').default}
  alt="解压后保留 3MF、清单、说明和数据目录"
/>
'''
translate = '''
'''

[[block]]
key = "6821b9649766d603"
type = "paragraph"
origin = '''
解压下载好的 ZIP 包，在根目录找到扩展名为 `.3mf` 的打印项目文件。目录内同时包含 `manifest`、说明文件和数据目录模板，请保持原有文件完整，切勿删除或改名。
'''
translate = '''
Extract the ZIP archive and locate the `.3mf` file in the root folder alongside `manifest.json`, the read-me file, and the dataset template folders.
'''

[[block]]
key = "5a8ea220020e9d89"
type = "paragraph"
origin = '''
双击 `.3mf` 文件，或在 Bambu Studio / OrcaSlicer 中通过“打开项目”载入，即可看到由多个阶梯方格组成的梯度卡模型。
'''
translate = '''
Open the `.3mf` in Bambu Studio or OrcaSlicer and expand **Gradient Card** in the **Objects** list. Each card consists of two parts:

- **Base - White** — the backing plate.
- **Step - Sample** — the stepped gradient patches printed with your test filament.
'''

[[block]]
key = "316a307456421e6f"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/04-open-in-bambu-studio.webp').default}
  alt="在 Bambu Studio 中打开实际生成的 3MF"
/>
'''
translate = '''
'''

[[block]]
key = "7c46e0e8d5c15bcd"
type = "paragraph"
origin = '''
展开对象列表后，模型包含两个零件：“Base - White”为底板，“Step - Sample”为上方的梯度色块。
'''
translate = '''
'''

[[block]]
key = "d105a855edabd596"
type = "paragraph"
origin = '''
若切片软件提示打印机、喷嘴或配置不兼容，请返回 Lumina Studio 的“设置”核对切片软件、打印机型号和喷嘴尺寸，重新生成配置文件包后再打开。
'''
translate = '''
If the slicer warns of an incompatible printer, nozzle, or profile, return to Lumina **Settings**, verify your hardware configuration, and generate a new package rather than overriding the project settings.
'''

[[block]]
key = "19e06e5f6e55ad1e"
type = "heading"
origin = '''
## 第五步：准备白底和黑底两张色卡
'''
translate = '''
## Step 5: Prepare a white-base and a black-base card

<img
  src={require('./assets/07-material-mapping.webp').default}
  alt="Map the four objects to white, red, black, and red"
/>

The project opens with one complete card. Confirm that both **Base - White** and **Step - Sample** are present, then duplicate the card so two identical cards sit on the build plate.

For the first card (white base):

- Assign **Base - White** to the white filament.
- Assign **Step - Sample** to the red test filament.
'''

[[block]]
key = "54c7ba1366ea99ac"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/05-material-mapping.webp').default}
  alt="白底、黑底和红色样本层的对象映射"
/>
'''
translate = '''
'''

[[block]]
key = "31066c7ba2735522"
type = "paragraph"
origin = '''
默认配置包中包含一张完整的梯度卡模型。先展开对象列表确认包含“Base - White”和“Step - Sample”，再将整张色卡复制一份，使同一打印盘上并排放置两张梯度卡：
'''
translate = '''
For the second card (black base):
'''

[[block]]
key = "b2970673698352dc"
type = "list"
composite = true
origin = '''
{{b2970673698352dc-2a8f6900cfe18a1f}}
{{b2970673698352dc-30ee6bdfe48dc134}}
'''
translate = '''
- Assign **Base - White** to the black filament (**Base - White** is simply the original part name; the assigned filament slot controls the printed color).
- Assign **Step - Sample** to the same red test filament.
'''

[[block]]
key = "b2970673698352dc-2a8f6900cfe18a1f"
type = "listItem"
composite = true
origin = '''
- {{b2970673698352dc-2a8f6900cfe18a1f-c4ca3eb18fb17b84}}
'''
translate = '''
'''

[[block]]
key = "b2970673698352dc-2a8f6900cfe18a1f-c4ca3eb18fb17b84"
type = "paragraph"
origin = '''
**白底卡（第一张）**：将“Base - White”分配为白色耗材，“Step - Sample”分配为待测试的红色耗材。
'''
translate = '''
'''

[[block]]
key = "b2970673698352dc-30ee6bdfe48dc134"
type = "listItem"
composite = true
origin = '''
- {{b2970673698352dc-30ee6bdfe48dc134-3541dcb7fa0a9ae4}}
'''
translate = '''
'''

[[block]]
key = "b2970673698352dc-30ee6bdfe48dc134-3541dcb7fa0a9ae4"
type = "paragraph"
origin = '''
**黑底卡（第二张）**：将底板对象分配为黑色耗材，“Step - Sample”同样分配为同一卷红色耗材（底板对象原名仍显示“Base - White”，实际打印颜色以所选耗材槽为准）。
'''
translate = '''
'''

[[block]]
key = "cf276d856815c5f9"
type = "paragraph"
origin = '''
映射完成后检查确认：一张为白底配红阶梯层，另一张为黑底配红阶梯层。请保持模型原始尺寸与高度不变，切勿缩放模型或将底板与样本层分到同一种耗材。
'''
translate = '''
Verify all four part assignments in order: **white, red, black, red** (slots **1, 3, 2, 3** in this example). Keep the original scale and Z height intact, and make sure the base and sample steps are never assigned to the same filament.
'''

[[block]]
key = "7a00df7ede7814ba"
type = "heading"
origin = '''
## 第六步：切片检查与打印
'''
translate = '''
## Step 6: Slice and inspect the result

<img
  src={require('./assets/08-bottom-view.webp').default}
  alt="Turn the cards to the bottom view and confirm the two bases"
/>

Before slicing, confirm your printer profile, nozzle diameter, and **0.08 mm** layer height, and verify that the white, black, and red filament slots were not reassigned automatically.

Click **Slice Plate** to generate toolpaths.

<img
  src={require('./assets/09-sliced-layer-preview.webp').default}
  alt="Move the layer slider through the sliced bottom preview"
/>
'''

[[block]]
key = "37390ac4658f082b"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/06-bottom-preview.webp').default}
  alt="翻到底面并逐层检查切片结果"
/>
'''
translate = '''
'''

[[block]]
key = "f345769f4faf5a1b"
type = "paragraph"
origin = '''
切片前，确认当前打印机、喷嘴及工艺层高与 Lumina 生成设置一致（本例为 0.08 mm），并复查白色、黑色与红色耗材槽位未被自动替换。
'''
translate = '''
In **Preview**, rotate the camera to the **Bottom** view and drag the layer slider through the print. Confirm that one base prints white, the other prints black, and the stepped patches on both cards print red, with no missing layers, floating paths, or unintended color swaps.
'''

[[block]]
key = "8d1c859e68c3a4b8"
type = "paragraph"
origin = '''
点击切片后进入“预览”，将视角翻到底面并拖动右侧层滑块逐层查看，确认白底和黑底上的红色梯度方格均完整清晰，无缺层、悬空或异常换色后再发起打印。打印完成后立即将两张色卡归拢，并标注耗材名称。
'''
translate = '''
Once the preview looks clean, send the print to your printer. Label both finished cards with the test filament name as soon as they come off the bed.
'''

