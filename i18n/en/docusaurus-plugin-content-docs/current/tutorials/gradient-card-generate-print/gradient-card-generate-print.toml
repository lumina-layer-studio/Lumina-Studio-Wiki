[[block]]
key = "3b30b685be5af364"
type = "heading"
origin = '''
## 常见问题
'''
translate = '''
## Common questions
'''

[[block]]
key = "e24e4d8206b7fd7d"
type = "heading"
origin = '''
### 可以只打印白底卡或黑底卡吗？
'''
translate = '''
### Can I print only the white-base card or only the black-base card?
'''

[[block]]
key = "f54b902b7165ce1e"
type = "paragraph"
origin = '''
不可以。每种待测耗材都必须成对打印白底卡与黑底卡。
'''
translate = '''
No. Every test filament requires both cards as a matched pair.
'''

[[block]]
key = "6632ede3c4c0b9c6"
type = "heading"
origin = '''
### 从 MakerWorld 下载了在线模型，还要生成 ZIP 吗？
'''
translate = '''
### If I print the MakerWorld model, do I still need the ZIP from Lumina?
'''

[[block]]
key = "6e5287ade6dbdd55"
type = "paragraph"
origin = '''
需要。在线模型可替代本地 3MF 用于打印，但后续提取耗材档案仍需读取本地生成的 ZIP 配置文件包。
'''
translate = '''
Yes. The MakerWorld model can substitute for the local 3MF when printing, but profile extraction still requires the configuration ZIP generated by Lumina.
'''

[[block]]
key = "a68b2bf52c88c6d6"
type = "heading"
origin = '''
### 第一次应该选哪个层高？
'''
translate = '''
### Which layer height should I choose first?
'''

[[block]]
key = "0d4c3526d1d0c9a7"
type = "paragraph"
origin = '''
建议从 0.08 mm 开始；熟练掌握打印、拍摄和提取流程后再尝试 0.04 mm。
'''
translate = '''
Start with **0.08 mm**. Move to **0.04 mm** once you are comfortable with printing, photographing, and extracting gradient cards.
'''

[[block]]
key = "ff9b32d2de357016"
type = "heading"
origin = '''
### 打开 3MF 后，打印机或喷嘴不匹配怎么办？
'''
translate = '''
### What if the printer or nozzle does not match when I open the 3MF?
'''

[[block]]
key = "ad52ffb0cf6cb932"
type = "paragraph"
origin = '''
返回 Lumina Studio 的“设置”核对切片软件、打印机型号和喷嘴尺寸，重新生成配置文件包后再打开，避免直接覆盖全部项目设置导致参数偏差。
'''
translate = '''
Return to Lumina **Settings**, select your actual slicer, printer model, and nozzle diameter, and generate a fresh package.
'''

[[block]]
key = "389289176dc78f88"
type = "heading"
origin = '''
### 对象名称里的“Base - White”为什么在第二张黑底卡上没有变？
'''
translate = '''
### Why is the second black base still named “Base - White”?
'''

[[block]]
key = "d4dad8af6b00af22"
type = "paragraph"
origin = '''
“Base - White”只是模型零件的初始名称，实际打印哪种底色完全取决于切片软件中分配给该零件的耗材槽位。
'''
translate = '''
`Base - White` is the static part name inside the 3MF. The printed base color is determined by the filament slot assigned in your slicer, which you can confirm in the sliced **Preview**.
'''
