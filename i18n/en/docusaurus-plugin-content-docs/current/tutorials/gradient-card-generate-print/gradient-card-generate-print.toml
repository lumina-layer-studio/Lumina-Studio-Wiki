'''

[[block]]
key = "169fbe34f8a8835f"
type = "paragraph"
origin = '''
每一种待测试耗材都需要打印一张白底色卡和一张黑底色卡。两张色卡的底板颜色不同，但上方的阶梯梯度色块必须使用同一卷待测试耗材。
'''
translate = '''
Every test filament requires two cards—one on a white base and one on a black base—with the stepped color blocks on both cards printed from the same spool.
'''

[[block]]
key = "9a14c6472f1cf2a6"
type = "heading"
origin = '''
