[[block]]
key = "fc9351d6d7803da6-93cd0fc0e97a462d-da8dea766512c8c8"
type = "paragraph"
origin = '''
Snapmaker U1、H2C 与扩展材料模板完整写入机型与耗材槽信息，修复导入 OrcaSlicer 后的机型识别、耗材用量与空槽问题。
'''
translate = '''
Preserved accurate printer and filament-slot metadata for Snapmaker U1, H2C, and extended-material templates, resolving model recognition, filament-usage, and empty-slot issues in OrcaSlicer.
'''

[[block]]
key = "fc9351d6d7803da6-f8fb1b8541ebadad"
type = "listItem"
composite = true
