## Common questions
'''

[[block]]
key = "1e6dbb7090a63370"
type = "heading"
origin = '''
### 为什么分块上限填了 180×180 mm，最后一块却只有 90×120 mm？
'''
translate = '''
'''

[[block]]
key = "758ef0d649af0bb7"
type = "paragraph"
origin = '''
`180×180 mm` 是单块的最大尺寸上限。当总尺寸无法被上限整除时，末列与末行只生成剩余部分：本例总宽 `450 mm` 扣除前两列各 `180 mm` 后末列宽 `90 mm`；总高 `300 mm` 扣除第一行 `180 mm` 后末行高 `120 mm`。
'''
translate = '''
'''

[[block]]
key = "9376a54b2a98a10d"
type = "heading"
origin = '''
### 能让所有分块的尺寸完全一致吗？
'''
translate = '''
'''

[[block]]
key = "c5422244450c0ba3"
type = "paragraph"
origin = '''
可以。只需将成品总宽与总高设为分块上限的整数倍（或在原图四周预先留白补齐比例），每一块切出来就会完全等大。调整时请注意保持原图纵横比，避免画面拉伸变形。
'''
translate = '''
'''

[[block]]
key = "7bbf095d7273b152"
type = "heading"
origin = '''
### 软件会在拼缝处自动预留重叠边或卡扣吗？
'''
translate = '''
### Why is the bottom-right tile only 90×120 mm?
'''

[[block]]
key = "163c18be559f7e83"
type = "paragraph"
origin = '''
不会。大画幅输出的是相邻无重叠的平切分块。如需搭接边、定位孔或榫卯结构，请在前期图形设计或三维建模软件中预先制作，并将附加结构一并计入热床可用尺寸。
'''
translate = '''
`180×180 mm` sets the upper limit per tile. Subtracting two `180 mm` columns from the `450 mm` total width leaves `90 mm` for Column 3, and subtracting one `180 mm` row from the `300 mm` total height leaves `120 mm` for Row 2.
'''

[[block]]
key = "6dcc5b1fc38f3631"
type = "heading"
origin = '''
### 网页整图预览很正常，为什么导入切片器后提示某一块超出打印范围？
'''
translate = '''
### Can I make every tile the exact same size?
'''

[[block]]
key = "55b77a694a21b03b"
type = "paragraph"
origin = '''
网页端的 2D 预览展示的是拼接后的整幅画面，不包含具体机型的热床禁打区、擦拭线或 Brim 宽度。可在切片器中关闭不必要的 Brim、调整模型位置，或返回 Lumina 将分块上限调小几毫米后重新生成。
'''
translate = '''
Yes—choose assembled Width and Height values that are exact multiples of your Tile Width and Tile Height (or pad your source canvas with intentional margins), taking care not to stretch the artwork out of proportion.
'''

[[block]]
key = "d942f2227c940bff"
type = "heading"
origin = '''
### 能把六个 3MF 同时摆进同一盘打印吗？
'''
translate = '''
### Does Lumina add overlap lips or alignment pins?
'''

[[block]]
key = "3d4414c681892b83"
type = "paragraph"
origin = '''
若单张热床本身就放得下整幅作品，直接关闭大画幅导出单个完整 3MF 即可，还能省去后期拼接。大画幅专为超出单盘面积的作品设计；对于较窄的末列或末行小分块，只要不越界、不重叠，也可以在切片器中视剩余空间合理拼盘。
'''
translate = '''
No. Tiles are cut flush along shared borders. If you need lap joints, dowel holes, or cutting allowances, build them into your source design or CAD model ahead of time and factor their extra width into your bed-size limit.
'''

[[block]]
key = "610e7aa4632add67"
type = "heading"
origin = '''
### 解压后发现其中某一个 3MF 打不开，需要重改整套参数吗？
'''
translate = '''
### Full Preview looked fine—why does one tile exceed my build plate in the slicer?
'''

[[block]]
key = "5ccee0220c598acf"
type = "paragraph"
origin = '''
先保留已正常解压的其余分块，用相同参数重新生成一次对比。若固定某一个坐标反复报错，重点检查原图对应区域是否有极细碎的噪点或特殊 SVG 路径。若网页持续转圈或生成中断，请按[打不开、一直转圈或生成失败，应该先查什么？](pathname:///zh/docs/knowledge/web-generation-troubleshooting/)排查。
'''
translate = '''
Lumina's 2D Preview displays the whole artwork rather than machine-specific bed keep-out zones, purge strips, or slicer Brims. Disable Brims along mating edges, reposition the part on the plate, or reduce Tile Width and Tile Height by a few millimeters and regenerate.
'''

[[block]]
key = "94382a8284816ece"
type = "heading"
origin = '''
### 拼接后为什么拼缝依然明显？
'''
translate = '''
### One 3MF tile failed to open. Do I have to redo the whole project?
'''

[[block]]
key = "aaa0fd623eca092f"
type = "paragraph"
origin = '''
数字模型严丝合缝，但实体打印会受到热胀冷缩、首层象脚（Elephant Foot）外扩、打印板局部纹理差异与光线折射影响。保持各盘切片参数与摆放方向一致、适度开启切片器的象脚补偿、打印后轻修边缘毛刺并借助平整背板定位，能显著改善拼缝观感。
'''
translate = '''
Keep the ZIP and the working tiles you already extracted, then run generation again with the same settings. If the exact same coordinate fails repeatedly, inspect that area of the artwork for micro-fragments or complex SVG effects, and consult [Slicer Detection and 3MF Open Troubleshooting](pathname:///en/docs/knowledge/slicer-path-and-open-troubleshooting/).
'''
