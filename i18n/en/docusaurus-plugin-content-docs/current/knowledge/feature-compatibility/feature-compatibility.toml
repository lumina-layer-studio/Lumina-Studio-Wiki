[[block]]
key = "11acd258fb4635e1"
type = "table"
origin = '''
| 功能 | 高保真 / 像素 | 原生矢量 SVG | 单面 / 双面 | 组合与检查要点 |
| --- | --- | --- | --- | --- |
| 颜色工作站与自定义配方 | ✅ | ✅ | ✅ | 修改后重新生成 3MF，并在切片器中核对耗材映射 |
| 外轮廓 | ✅ | ⚠️ | ✅ | 依赖清晰的透明边界；复杂 SVG 需检查轮廓闭合度 |
| 透明镀层 | ✅ | ✅ | ⚠️ | 双面模式下需核对镀层所在表面与实际打印顺序 |
| 分离底板 | ✅ | ✅ | ⚠️ | 仅拆分几何对象；双面或带槽结构需逐层核对 |
| 自由色 | ✅ | — | ⚠️ | 按匹配色提取独立对象；原生矢量模式暂不支持 |
| 浮雕 | ✅ | — | 仅单面 | 与掐丝珐琅互斥；独立高度图浮雕不支持批量模式 |
| 掐丝珐琅 | — | — | — | 当前版本隐藏入口；[旧版资料](../../reference/model-features/cloisonne/cloisonne.mdx)供归档参考 |
| 挂件环 | ✅ | ⚠️ | 推荐单面 | 不与磁铁槽或拼图共用；切片后检查环孔与主体连接宽度 |
| 冰箱贴磁铁槽 | ✅ | ⚠️ | 仅单面 | 不与拼图、大画幅或挂件环共用 |
| 拼图 | 专用流程 | — | 专用结构 | 不与批量、大画幅、磁铁槽或挂件环共用 |
| 大画幅 | 专用流程 | ⚠️ | 逐块检查 | 不与拼图或磁铁槽共用；复杂 SVG 可能自动转为栅格分块 |
| 批量模式 | 专用流程 | ⚠️ | 逐文件检查 | 不支持拼图、验证色卡与独立高度图浮雕 |
'''
translate = '''
| Feature | High-Fidelity / Pixel Art | Native Vector SVG | Single / Double-Sided | Key considerations |
| --- | --- | --- | --- | --- |
| Color Workstation & Custom Recipe | ✅ | ✅ | ✅ | Re-run **Generate** and verify spool mappings after edits |
| Outline | ✅ | ⚠️ | ✅ | Needs a clean alpha or vector boundary; inspect complex SVG borders |
| Transparent Coating | ✅ | ✅ | ⚠️ | On double-sided models, check which face is coated and verify print order |
| Separate Backing | ✅ | ✅ | ⚠️ | Splits meshes only; inspect layers on double-sided or recessed pieces |
| Free Color | ✅ | — | ⚠️ | Exports matched colors as objects; unavailable in Vector mode |
| Relief | ✅ | — | Single-sided only | Exclusive with Cloisonné; uploaded height-map Relief is unavailable in Batch |
| Cloisonné | — | — | — | Hidden in the current release; [older documentation](../../reference/model-features/cloisonne/cloisonne.mdx) is archived |
| Keychain Loop | ✅ | ⚠️ | Single-sided recommended | Exclusive with Fridge Magnet and Puzzle; check hole clearance and neck width |
| Fridge Magnet | ✅ | ⚠️ | Single-sided only | Exclusive with Puzzle, Large Format, and Keychain Loop |
| Puzzle | Dedicated workflow | — | Dedicated structure | Exclusive with Batch, Large Format, Fridge Magnet, and Keychain Loop |
| Large Format | Dedicated workflow | ⚠️ | Check each tile | Exclusive with Puzzle and Fridge Magnet; complex SVGs may fall back to raster tiling |
| Batch | Dedicated workflow | ⚠️ | Check each file | Unavailable with Puzzle, Validation Card, and uploaded height-map Relief |
'''

[[block]]
key = "c1a711cc7a4affc1"
type = "paragraph"
origin = '''
表中的“原生矢量 SVG”指 Lumina 的矢量建模模式（上传包含真实路径的 SVG）。建模模式选型详见[高保真、像素和 SVG 应该怎么选](pathname:///zh/docs/knowledge/image-mode-selection/)。
'''
translate = '''
Here, **Native Vector SVG** refers to Lumina's **Vector** modeling mode using real SVG path geometry rather than a raster PNG wrapped inside an `.svg` file. See [High-Fidelity, Pixel Art, or Vector?](pathname:///en/docs/knowledge/image-mode-selection/).
'''

[[block]]
key = "62dcdf70a2d21e49"
type = "heading"
