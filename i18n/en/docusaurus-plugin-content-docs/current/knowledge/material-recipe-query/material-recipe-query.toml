[[block]]
key = "e4d5f414481c0b75"
type = "paragraph"
origin = '''
接着选择每一显色层的层高（支持 **0.04 mm、0.08 mm 和 0.10 mm**）。该层高既参与混色预测计算，也会写入导出的验证色块 3MF，请与后续切片计划保持一致。
'''
translate = '''
'''

[[block]]
key = "e4f15232e262dcea"
type = "admonition"
composite = true
origin = '''
:::warning[统一队列层高]
{{e4f15232e262dcea-29029c68ad5a938e}}
:::
'''
translate = '''
'''

[[block]]
key = "e4f15232e262dcea-29029c68ad5a938e"
type = "paragraph"
origin = '''
同一块验证板上的所有色块共用同一切片层高。若中途切换了层高（例如从 0.08 mm 改为 0.04 mm），请先清空队列，按相同层高分组生成验证板。
'''
translate = '''
'''

[[block]]
key = "b3a50eae2be83366"
type = "paragraph"
origin = '''
生成的验证色块默认采用白色分隔网格与白色中央背板（本文示例使用白色基底与 0.08 mm 层高）。若需进行黑底实物验证，导入切片器后请将背板对象指定为对应的黑色耗材。
'''
translate = '''
Light transmission and coverage change with layer thickness, so keep the layer height consistent across all candidates queued onto the same swatch plate.
'''

