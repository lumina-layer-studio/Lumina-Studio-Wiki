[[block]]
key = "73fe5cc615b7bb5e"
type = "heading"
origin = '''
## 分离底板与底板层高修改器的区别
'''
translate = '''
## Separate Backing vs. Backing Layer Height Modifier
'''

[[block]]
key = "5f484b06b05e4e63"
type = "paragraph"
origin = '''
这两个选项都涉及底板，但作用互不相同：
'''
translate = '''
Both settings involve the backing, but they serve different purposes:
'''

[[block]]
key = "558e9f2f0bca2d44"
type = "list"
composite = true
origin = '''
{{558e9f2f0bca2d44-560734b519df76b5}}
{{558e9f2f0bca2d44-18a7938a63739f5a}}
'''
translate = '''
- **Separate Backing** exports the backing as its own object so you can select it, assign a filament, or adjust per-object settings in the slicer.
- **Backing Layer Height Modifier** keeps the object structure intact and assigns a coarser layer height to the backing's Z-range.
'''

[[block]]
key = "558e9f2f0bca2d44-560734b519df76b5"
type = "listItem"
composite = true
origin = '''
- {{558e9f2f0bca2d44-560734b519df76b5-8059b5bb75c15493}}
'''
translate = '''
'''

[[block]]
key = "558e9f2f0bca2d44-560734b519df76b5-8059b5bb75c15493"
type = "paragraph"
origin = '''
**分离底板**：将底板导出为独立对象，便于在切片器中单独选中、指定耗材或调整参数。
'''
translate = '''
'''

[[block]]
key = "558e9f2f0bca2d44-18a7938a63739f5a"
type = "listItem"
composite = true
origin = '''
- {{558e9f2f0bca2d44-18a7938a63739f5a-e497169104f9f740}}
'''
translate = '''
'''

[[block]]
key = "558e9f2f0bca2d44-18a7938a63739f5a-e497169104f9f740"
type = "paragraph"
origin = '''
**底板层高修改器**：保持原有对象结构不变，仅为底板所在的 Z 轴区间指定粗层高。
'''
translate = '''
'''

[[block]]
key = "7d30f5f952fe6a23"
type = "paragraph"
origin = '''
需要单独管理底板耗材且同时缩短底板打印时间时，可以同时开启这两项，并在切片预览中核对最终层序。
'''
translate = '''
You can enable either or both depending on whether you need independent object control, faster backing layers, or both.
'''

[[block]]
key = "c061010685ea47ae"
type = "heading"
origin = '''
## 不适用或需留意的场景
'''
translate = '''
## Special Workflows
'''

[[block]]
key = "ffddd12c8f8ff351"
type = "heading"
origin = '''
### 梯度色卡
'''
translate = '''
### Gradient Calibration Cards
'''

[[block]]
key = "9fc151f878ac9b3c"
type = "paragraph"
origin = '''
梯度色卡使用固定的层高结构与对象配色方案，生成时无需叠加普通作品的底板层高修改器。请直接按[生成并打印梯度色卡](pathname:///zh/docs/tutorials/gradient-card-generate-print/)中的参数设置。
'''
translate = '''
Gradient cards rely on fixed layer heights, object-color assignments, and print settings. Leave the standard backing modifier off and follow [Generate and Print Gradient Calibration Cards](pathname:///en/docs/tutorials/gradient-card-generate-print/).
'''

[[block]]
key = "2594e2a3b7aa3a40"
type = "heading"
origin = '''
### 拼图与专用导出结构
'''
translate = '''
### Puzzle and Specialized Exports
'''

[[block]]
key = "4fae48bc263b1b5a"
type = "paragraph"
origin = '''
拼图、分块等专用模式会按自身结构管理切片参数，直接按对应教程导出即可，无需手动额外添加 0.20 mm 高度范围。
'''
translate = '''
Puzzle and other specialized export modes manage their own geometry and slicing metadata without needing manual height-range additions.
'''

[[block]]
key = "21e78fe4345b2459"
type = "heading"
origin = '''
### 双面或复杂附件结构
'''
translate = '''
### Double-Sided or Recessed Models
'''

[[block]]
key = "92fd99944b8e46b7"
type = "paragraph"
origin = '''
制作双面显色模型，或底板中带有磁铁槽、嵌件等交错结构时，请在切片预览中逐层确认粗层高区间是否仅落在纯底板部分。如果修改器触及任一侧显色层，请关闭“底板层高修改器”后重新生成 3MF。
'''
translate = '''
On double-sided prints, or models with magnet recesses and interleaved attachments, step through every layer in slicer Preview to confirm that the coarse range stays strictly inside the backing. If the range touches either display face, disable **Backing Layer Height Modifier** and generate a fresh 3MF.
'''

[[block]]
key = "a82205228a333bf8"
type = "heading"
origin = '''
### 其他切片器
'''
translate = '''
### Non-Bambu Slicers
'''

[[block]]
key = "1d20255b107a5401"
type = "paragraph"
origin = '''
非 Bambu 系切片器可能会忽略 3MF 中的高度范围元数据。导入后若未显示局部层高区间，可使用该切片器原生的高度范围修改功能手动设置，并在切片后逐层核对。
'''
translate = '''
If your slicer does not import the height range from the 3MF, configure an equivalent height-range modifier natively in that slicer and verify the sliced layers in Preview.
'''

[[block]]
key = "cbbf3b866f003400"
type = "heading"
origin = '''
## 常见问题 Q&A
'''
translate = '''
## Common Questions
'''

[[block]]
key = "bbe44d774c0eb4ec"
type = "heading"
origin = '''
### 为什么调低了底板填充率，切片预览里看起来仍是实心？
'''
translate = '''
### Why does the base still look solid after I lower its infill?
'''

[[block]]
key = "b287df60be731ae3"
type = "paragraph"
origin = '''
底板靠近观赏面的区域会自动保留实心过渡层；当底板较薄时，整个底板都可能处于实心保护区内。底板层高修改器只改变单层厚度，不影响填充率。具体规则见[底板填充率](../../reference/converter-basic/backing-infill/backing-infill.mdx)。
'''
translate = '''
The region of the base closest to each viewing surface stays solid to protect visual uniformity, so a thin base may fall entirely within that solid zone. Meanwhile, the layer-height modifier changes layer thickness rather than infill density. See [Base Plate Infill](../../reference/converter-basic/backing-infill/backing-infill.mdx) for details.
'''

[[block]]
key = "655b188619d579d3"
type = "heading"
origin = '''
### 为什么切片器顶部工艺仍显示 0.08 mm，底板却是 0.20 mm？
'''
translate = '''
### Why does the process preset still show 0.08 mm when the backing prints at 0.20 mm?
'''

[[block]]
key = "bde347067e474fd0"
type = "paragraph"
origin = '''
顶部工艺栏显示的是项目全局基础层高，而底板层高修改器作用于对象的局部高度范围。展开对象列表查看高度范围，并在切片预览中切换到“层高”视图即可看到实际分布。
'''
translate = '''
The process header displays the base layer height for the project, while the backing uses an object-level height-range override. Switch the slicer Preview color scheme to **Layer Height** or expand the object tree to inspect both values.
'''

[[block]]
key = "76d9f3a88816ab5d"
type = "heading"
origin = '''
### 我选了 0.04 mm，为什么导出后同时看到 0.08 mm 或 0.20 mm？
'''
translate = '''
### I selected 0.04 mm. Why do I also see 0.08 mm or 0.20 mm?
'''

[[block]]
key = "6d1e11cad8e7516b"
type = "paragraph"
origin = '''
项目里可能同时存在显色层层高、全局基础层高和底板局部层高三个数值。请先核对当前耗材档案或 LUT 是否支持 0.04 mm；若所选层高与切片预览中的显色层实际层高不一致，请检查数据来源设置后重新生成。
'''
translate = '''
Three separate values may be visible: Color Layer Height, the slicer's base process layer height, and the backing's local height range. Check which value you are viewing and verify that your selected Material Archives or Classic LUT supports `0.04 mm`.
'''

[[block]]
key = "8e33eaec325e2975"
type = "heading"
origin = '''
### 可以把显色层也改成 0.20 mm 来进一步提速吗？
'''
translate = '''
### Can I set the color layers to 0.20 mm as well to save more time?
'''

[[block]]
key = "a07987192ab7eb1a"
type = "paragraph"
origin = '''
仅在所用耗材档案或 LUT 明确标定支持 0.20 mm 显色层高时才可使用。将 0.08 mm 配方直接改为 0.20 mm 会改变透光与混色结果，导致成品严重偏色。
'''
translate = '''
Only if your Material Archives or Classic LUT explicitly supports a `0.20 mm` color layer height. Changing `0.08 mm` color layers to `0.20 mm` alters light transmission and breaks the calibrated color recipes.
'''

[[block]]
key = "acf44f23a6eacc2f"
type = "heading"
origin = '''
### 0.2 mm 喷嘴也使用 0.20 mm 的底板层高吗？
'''
translate = '''
### Does a 0.2 mm nozzle also use 0.20 mm backing layers?
'''

[[block]]
key = "3daae6fb12738535"
type = "paragraph"
origin = '''
不是。Lumina 按喷嘴直径的一半设定底板粗层高：0.4 mm 喷嘴使用 0.20 mm，0.2 mm 喷嘴使用 0.10 mm。
'''
translate = '''
No. Lumina sets the backing modifier to half the nozzle diameter: `0.20 mm` for a `0.4 mm` nozzle and `0.10 mm` for a `0.2 mm` nozzle.
'''

[[block]]
key = "1ed00a557afaaa29"
type = "heading"
origin = '''
### 为什么“设置”里没有显示底板层高修改器？
'''
translate = '''
### Why is Backing Layer Height Modifier hidden in Settings?
'''

[[block]]
key = "8a1322399fc851b1"
type = "paragraph"
origin = '''
该选项仅在切片软件选择 Bambu 系兼容切片器时显示。若使用其他切片器，请在导出模型后使用对应切片器自带的局部层高功能。
'''
translate = '''
It is displayed only when a compatible Bambu-family slicer is selected in **Settings**. For other slicers, apply a local height-range modifier directly in your slicer.
'''

[[block]]
key = "14cbb5bb4230a5da"
type = "heading"
origin = '''
### 打印预计耗时仍然较长，还能继续加大底板层高吗？
'''
translate = '''
### Can I raise the backing layer height even further if the print is still long?
'''

[[block]]
key = "be56390b29e233f3"
type = "paragraph"
origin = '''
局部层高受喷嘴直径、线宽和挤出流量限制（通常不超过喷嘴直径的 75%）。建议先确认修改器已在切片预览中生效；如确需进一步调整底板参数，建议先用小尺寸样件测试表面平整度与层间结合强度。
'''
translate = '''
Maximum layer height is limited by nozzle diameter, line width, and volumetric flow. Confirm first that the modifier is active in slicer Preview, and test any manual overrides on a small sample print before running a full piece.
'''
