'''
translate = '''
'''

[[block]]
key = "bb0af6408b37a2d2"
type = "paragraph"
origin = '''
该开关默认开启，修改后自动保存，且仅在切片软件设为 Bambu 系兼容切片器时显示。修改器不会改变你设定的底板总厚度，而是用更少、更厚的层完成同一段底板高度，从而缩短打印时间。
'''
translate = '''
Other slicers may ignore this 3MF height-range metadata and require configuring a local height modifier directly in the slicer.
'''

[[block]]
key = "903d1bed10772b11"
