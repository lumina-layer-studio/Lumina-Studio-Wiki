[[block]]
key = "56fcbc06bcd18b42"
type = "heading"
origin = '''
# 切片器没检测到，或者 3MF 打不开怎么办？
'''
translate = '''
# Slicer Not Detected or 3MF Will Not Open
'''

[[block]]
key = "d8e92f22e63ae06c"
type = "paragraph"
origin = '''
遇到“打不开 3MF”时，问题通常出现在以下四个环节之一：
'''
translate = '''
When a 3MF will not open in your slicer, the issue typically occurs at one of five distinct points:
'''

[[block]]
key = "c6e6d4bf45d4ca2a"
type = "list"
composite = true
origin = '''
{{c6e6d4bf45d4ca2a-be61c6891ef508ae}}
{{c6e6d4bf45d4ca2a-d6f7a1a527dabd3d}}
{{c6e6d4bf45d4ca2a-063f77a51700e1dc}}
{{c6e6d4bf45d4ca2a-cc1d9232e96ed532}}
'''
translate = '''
1. Lumina has not finished generating a valid 3MF.
2. The browser download is incomplete or expired.
3. The 3MF downloaded cleanly, while one-click slicer launch is blocked or unconfigured.
4. The slicer being used does not match the export format selected in Lumina.
5. The slicer imported raw geometry only instead of opening the full project.
'''

[[block]]
key = "c6e6d4bf45d4ca2a-be61c6891ef508ae"
type = "listItem"
composite = true
origin = '''
1. {{c6e6d4bf45d4ca2a-be61c6891ef508ae-c478d2413b2c872c}}
'''
