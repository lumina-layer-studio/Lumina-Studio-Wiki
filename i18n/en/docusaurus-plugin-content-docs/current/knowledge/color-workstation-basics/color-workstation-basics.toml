type = "paragraph"
origin = '''
**适合场景**：统一替换全图的某一种背景灰、合并相邻阶梯色带，或为整类颜色套用同一条自定义配方。
'''
translate = '''
'''

[[block]]
key = "d06c9af98a9c74b8-e2601358a940a850"
type = "listItem"
composite = true
origin = '''
- {{d06c9af98a9c74b8-e2601358a940a850-32da15c503d36e04}}
'''
translate = '''
'''

