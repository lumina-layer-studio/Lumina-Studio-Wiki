[[block]]
key = "28ee3ddccb1603ba"
type = "heading"
origin = '''
## 自由色的作用与用法
'''
translate = '''
## Working with Free Color

Clicking **Mark as Free Color** flags the selected matched color so that the next **Generate** exports its geometry as a standalone 3MF object (for example, `Free_FF0000`).

**When to use Free Color:**

- You want to map a logo, border, or flat accent directly to a dedicated spool in your slicer;
- You prefer to assign a specialty filament—such as silk, metallic, or glow-in-the-dark—outside the automatic layered color stack.
'''

[[block]]
key = "fbca253fc469e983"
type = "paragraph"
origin = '''
点击“标记为自由色”会将当前选中的**匹配色**登记为自由色，并在下次生成 3MF 时把画面中所有使用该匹配色的区域提取为独立的 `Free_颜色值` 对象：
'''
translate = '''
**How Free Color behaves:**
'''

[[block]]
key = "1548a1460d88b135"
type = "list"
composite = true
origin = '''
{{1548a1460d88b135-bbe0e3e5e643fb05}}
{{1548a1460d88b135-b787f262f646e323}}
'''
translate = '''
- It groups geometry by matched color, so every region sharing that matched color enters the same `Free_` object;
- Hardware slot limits still apply—make sure your printer or AMS has a slot ready for the spool you assign in your slicer;
- **Clear Free Colors** removes Free Color flags while leaving all color replacements and **Custom Recipes** untouched.
'''

[[block]]
key = "1548a1460d88b135-bbe0e3e5e643fb05"
type = "listItem"
composite = true
origin = '''
- {{1548a1460d88b135-bbe0e3e5e643fb05-37b2c47a93b328c0}}
'''
translate = '''
'''

[[block]]
key = "1548a1460d88b135-bbe0e3e5e643fb05-37b2c47a93b328c0"
type = "paragraph"
origin = '''
**主要用途**：将该颜色区域在切片器中单独选中，直接指定给手头某一卷专色、丝绸或夜光等实体线材；或在自动叠色不便表现时改由切片器手动指定耗材槽位。
'''
translate = '''
'''

[[block]]
key = "1548a1460d88b135-b787f262f646e323"
type = "listItem"
composite = true
origin = '''
- {{1548a1460d88b135-b787f262f646e323-b94f98e8bed30918}}
'''
translate = '''
'''

[[block]]
key = "1548a1460d88b135-b787f262f646e323-b94f98e8bed30918"
type = "paragraph"
origin = '''
**作用范围**：按匹配色值提取对象（画面中凡属同一匹配色的色块都会归入同一个 `Free_` 对象），且实际可用颜色种类仍取决于打印机的多色料槽容量与实体线盘。
'''
translate = '''
'''

[[block]]
key = "4637b5dcefc454bb"
type = "paragraph"
origin = '''
已标记的自由色会在色板上显示专属标识。点击“清除自由色”只会移除自由色对象标记，不会清空已完成的颜色替换或自定义配方。导出 3MF 后，请在切片器对象列表中找到对应的 `Free_颜色值` 对象，手动为其绑定目标耗材与物理料槽。
'''
translate = '''
After clicking **Generate**, locate the `Free_FF0000` (or corresponding `Free_` hex) object in your slicer's object list and assign it to the physical filament spool you plan to load.
'''

[[block]]
key = "ab3aca503700989f"
type = "heading"
origin = '''
## 渐变分组（海带纹）处理
'''
translate = '''
## Handling Gradient Groups
'''

[[block]]
key = "1b67ef33ea1e0fbb"
type = "paragraph"
origin = '''
在耗材档案模式下，平滑渐变有时会被匹配成几条交替切换的相邻材料色带。当系统识别到这类区域时，会在面板中列出“渐变分组（海带纹）”供你按需处理：
'''
translate = '''
In **Material Archive** mode, smooth gradients can occasionally step across adjacent filament combinations, forming visible contour bands. When **Color Workstation** detects these patterns, it lists them as gradient groups:
'''

[[block]]
key = "f0d78fe1aec43dc0"
type = "list"
composite = true
origin = '''
{{f0d78fe1aec43dc0-d7bed00a3a5c0d07}}
{{f0d78fe1aec43dc0-6ddfb0206d32a48a}}
{{f0d78fe1aec43dc0-08b729dc4631ce0b}}
'''
translate = '''
- Click a group or sub-region first to inspect its highlight on the canvas;
- Merge a noisy sub-region or unify the group into a single representative shade when you want cleaner flat areas;
- Leave intentional shading, soft shadows, or skin-tone transitions unmerged when multi-step gradation looks better.
'''

[[block]]
key = "f0d78fe1aec43dc0-d7bed00a3a5c0d07"
type = "listItem"
composite = true
origin = '''
- {{f0d78fe1aec43dc0-d7bed00a3a5c0d07-b3a17a36d69b465a}}
'''
