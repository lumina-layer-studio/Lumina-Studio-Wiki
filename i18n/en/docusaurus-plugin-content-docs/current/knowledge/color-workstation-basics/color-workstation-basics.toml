[[block]]
key = "d64da44a67fa9e8c"
type = "heading"
origin = '''
## 撤销、清空替换与取消的区别
'''
translate = '''
## Undo, Clear Remaps, and Cancel
'''

[[block]]
key = "cc5155843e8ea183"
type = "list"
composite = true
origin = '''
{{cc5155843e8ea183-abbca0de2c2ff215}}
{{cc5155843e8ea183-3b778bec766207a9}}
{{cc5155843e8ea183-d3302688dbae677c}}
'''
translate = '''
- **Undo / Redo**: **Undo** reverts the most recent selection or replacement step, and **Redo** reapplies an undone action.
- **Clear Remaps**: Strips all global color remaps and local-region edits from the current session, restoring the base automatic match. Click **Generate** afterward if you want a fresh 3MF of the restored match.
- **Cancel (pending row)**: Discards only the uncommitted source → target pair currently awaiting confirmation.
'''

[[block]]
key = "cc5155843e8ea183-abbca0de2c2ff215"
type = "listItem"
composite = true
origin = '''
- {{cc5155843e8ea183-abbca0de2c2ff215-6db5259f934a9f0a}}
'''
translate = '''
'''

[[block]]
key = "cc5155843e8ea183-abbca0de2c2ff215-6db5259f934a9f0a"
type = "paragraph"
origin = '''
**撤销 / 重做**：“撤销”回退上一步选区或换色操作，“重做”恢复刚撤回的修改。操作后可结合预览画面与高亮状态确认当前步骤。
'''
