type = "paragraph"
origin = '''
**留意边界**：若人物眼睛与衣服恰好匹配到了同一种颜色，使用该工具会同时改变这两处；仅修改单处细节时请改用“点选色块”。
'''
translate = '''
'''

[[block]]
key = "2d09624eec65f25e"
type = "heading"
origin = '''
### 相近颜色
'''
translate = '''
### Similar colors
'''

[[block]]
key = "e2077cafd8518f01"
type = "paragraph"
origin = '''
点击画面中的某个色块，自动一并选中色彩接近的区域。调高容差会扩大纳入的颜色范围，容差设为 `0` 时仅选中完全相同的匹配色。处理渐变附近区域时，先观察高亮边界再确认替换。
'''
translate = '''
Click a region on the preview to select blocks within a color tolerance. Raising the tolerance widens the selection; setting tolerance to `0` selects only exact matches. Check the highlight overlay carefully near smooth gradients before confirming.
'''

[[block]]
key = "e762b6dd01bb7a2e"
type = "heading"
origin = '''
### 点选色块
'''
translate = '''
### Pick blocks
'''

[[block]]
key = "a31c11bdde23ec66"
type = "paragraph"
origin = '''
在预览图上逐个点击连通色块以添加或取消选中，适合精准修改眼睛、高光、小字或局部饰品等独立细节。
'''
translate = '''
Click individual connected regions on the preview canvas to toggle them in or out of your selection—ideal for isolated details such as eyes, specular highlights, or lettering.
'''

[[block]]
key = "be7f955e4638904c"
type = "heading"
origin = '''
### 选区画笔
'''
translate = '''
### Selection brush
'''

[[block]]
key = "f78a14ed8447ec67"
type = "paragraph"
origin = '''
按住鼠标在预览图上涂抹并应用选区。画笔会完整选中笔迹触及的连通色块，支持调节画笔粗细，涂抹后可通过高亮轮廓确认实际命中范围。
'''
translate = '''
Drag across the preview canvas and apply the stroke to select every contiguous color block touched by the brush. Adjust the brush size as needed and inspect the highlighted boundary before choosing a target color.
'''

[[block]]
key = "27023c507f15347b"
type = "heading"
origin = '''
### 跨工具组合选区
'''
translate = '''
### Combining Tools
'''

[[block]]
key = "c93c82672fc20980"
type = "paragraph"
origin = '''
四种选区工具共享当前选中状态，切换工具不会清空已有选区，方便先框选大块再用点选微调。如需清空重选，点击“全不选”即可。
'''
translate = '''
All four tools work on the same active selection, so switching tools keeps your current selection intact. Click **Select none** whenever you want to clear the selection and start fresh.
'''

[[block]]
key = "b3163b5ba39c1546"
type = "heading"
origin = '''
## 完成一次颜色替换
'''
translate = '''
## Making a Color Replacement
'''

[[block]]
key = "15a85175298421e4"
type = "heading"
origin = '''
### 第一步：确认基础预览正常
'''
translate = '''
### 1. Check the Base Preview First
'''

[[block]]
key = "b46f42b5fda572d9"
type = "paragraph"
origin = '''
开始局部微调前，先确认原图的主体轮廓、透明抠图与整体色调正常。若基础预览存在大面积偏色、破洞或轮廓错位，建议先调整原图、色彩来源或建模模式，再进入颜色工作站细修。
'''
translate = '''
Verify that the model's outer silhouette, transparency, and overall palette look sound before fine-tuning individual regions. Issues such as missing alpha boundaries, holes, or mismatched filament sets are best resolved in your source image or converter settings first.
'''

[[block]]
key = "41202ca8f397f89a"
type = "heading"
origin = '''
### 第二步：选定修改范围
'''
translate = '''
### 2. Select the Target Scope
'''

[[block]]
key = "84f06e6456b4c79b"
type = "paragraph"
origin = '''
根据目标属于“全图同色”还是“独立连通色块”选用对应工具，并通过画面上的高亮遮罩核对实际选区边界。
'''
translate = '''
Pick a global or local selection tool and rely on the highlight overlay on the canvas to verify exactly which regions will change.
'''

[[block]]
key = "ad30d26d1293e826"
type = "heading"
origin = '''
