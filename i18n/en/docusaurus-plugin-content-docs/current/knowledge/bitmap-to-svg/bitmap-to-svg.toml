[[block]]
key = "24b455e5b9a8bb9f"
type = "heading"
origin = '''
# 从位图生成 SVG，再发送到图像转换
'''
translate = '''
# Convert a Bitmap to SVG, Then Continue in Image Converter
'''

[[block]]
key = "dac76b69fecb9b02"
type = "paragraph"
origin = '''
当手头只有 PNG、JPG、WebP 或 BMP 位图，而图案本身是边界清晰的 Logo、图标、线稿或纯色色块时，可以先用 Lumina Studio 的“图像转矢量”工具将像素描摹为 SVG 路径，再送入“图像转换”继续建模。
'''
translate = '''
Lumina's **Vectorizer** traces bitmap images—PNG, JPG, WebP, or BMP—into clean SVG paths so logos, icons, line art, and flat-color illustrations can scale smoothly and use the native Vector workflow.
'''

[[block]]
key = "f438eaaec5263bc9"
type = "paragraph"
origin = '''
如果不清楚何时保留位图、何时使用 SVG，可先阅读[位图与矢量图有什么区别？](pathname:///zh/docs/knowledge/bitmap-vs-vector/)。
'''
translate = '''
Because automatic tracing fits new curves to existing pixels, it works best on artwork with clear edges rather than photographs or soft gradients, and it cannot recover detail that is missing or blurred in the original image.
'''

[[block]]
key = "9d7a65faa672a251"
type = "admonition"
composite = true
origin = '''
:::info[流程概览]
{{9d7a65faa672a251-9f1068b71d5443a1}}
:::
'''
translate = '''
'''

[[block]]
key = "9d7a65faa672a251-9f1068b71d5443a1"
type = "paragraph"
origin = '''
本文涵盖从上传位图、调整矢量化参数、对比原图与 SVG，到下载文件或直接发送到“图像转换”的完整步骤。照片、复杂绘画与柔和渐变通常建议直接使用原始位图。
'''
translate = '''
'''

