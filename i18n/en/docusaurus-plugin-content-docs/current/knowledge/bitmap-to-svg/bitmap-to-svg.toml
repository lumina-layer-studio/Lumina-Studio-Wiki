[[block]]
key = "cbbf3b866f003400"
type = "heading"
origin = '''
## 常见问题 Q&A
'''
translate = '''
## Common Questions
'''

[[block]]
key = "73d1d57d0793e8f8"
type = "heading"
origin = '''
### 位图转成 SVG 后画质一定会变清晰吗？
'''
translate = '''
'''

[[block]]
key = "6ddb8ee1646a3e9e"
type = "paragraph"
origin = '''
不会自动提升原图清晰度。SVG 的优势是路径可任意缩放而不产生像素马赛克，但路径形状来自对原图像素的描摹；若原图本身存在模糊、锯齿或压缩色块，这些瑕疵也会被描摹进路径里。
'''
translate = '''
'''

[[block]]
key = "067668a4ad02578c"
type = "heading"
origin = '''
### 颜色数量设多少合适？
'''
translate = '''
### Does vectorization increase the resolution of a blurry image?
'''

[[block]]
key = "0f1fddfeee2153e6"
type = "paragraph"
origin = '''
首次运行建议先用“自动”档查看基准效果。Logo 和图标可手动设为原设计的实际配色数；若复杂插画需要设极高的颜色数才能勉强还原层次，直接使用原始位图配合高保真模式往往更自然。
'''
translate = '''
Tracing replaces pixel grids with mathematical curves that scale smoothly without blocky edges, but it cannot reconstruct facial features, fine lettering, or textures that were already blurred in the source bitmap.
'''

[[block]]
key = "d920c64337573f6d"
type = "heading"
origin = '''
### 形状数越多代表细节越好吗？
'''
translate = '''
### Should I set Color Count as high as possible?
'''

[[block]]
key = "d27073376e347ed2"
type = "paragraph"
origin = '''
不一定。形状数偏高既可能是保留了丰富细节，也可能是把背景噪点、压缩伪影和渐变切成了大量细碎色块。判断标准是主体轮廓是否准确、文件后续预览和切片是否顺畅。
'''
translate = '''
No. Extra colors often split anti-aliased edges and compression noise into fragile slivers. Use the lowest **Color Count** that captures the intended palette cleanly.
'''

[[block]]
key = "a7019eafb50401c9"
type = "heading"
origin = '''
### 为什么连续渐变转成 SVG 后变成了一条条色带？
'''
translate = '''
### Why does a traced photo look posterized?
'''

[[block]]
key = "f6a4d70ab1522ae5"
type = "paragraph"
origin = '''
矢量图由边界明确的填充色块组成，处理连续渐变时会自动离散为有限级数的色阶区域。如果平滑渐变是画面的核心表现，建议保留原始位图并使用高保真模式。
'''
translate = '''
Vector tracing represents continuous tone using discrete flat-color shapes. Unless you want a stylized poster effect, keep photographs as bitmaps and use **High-Fidelity** mode.
'''

[[block]]
key = "111a34e8652cd69e"
type = "heading"
origin = '''
### 发送到图像转换后，为什么还要重新选 LUT 或耗材档案？
'''
translate = '''
### Can I edit the downloaded SVG in another app before converting?
'''

[[block]]
key = "995e93ff94a78a17"
type = "paragraph"
origin = '''
SVG 文件只记录二维几何路径与屏幕显示色，不包含任何打印机与耗材叠色配方。选定经典 LUT 或耗材档案后，Lumina 才能将 SVG 色块转换为可打印的多层结构。
'''
translate = '''
Yes. Click **Download SVG**, edit paths and fills in Illustrator, Inkscape, or Affinity Designer, and upload the saved SVG to **Image Converter**. Stick to standard closed paths and solid fills—external fonts, blur filters, complex masks, and embedded rasters may not convert into 3D geometry.
'''

[[block]]
key = "fdc7638fef995ddf"
type = "heading"
origin = '''
### 发送到图像转换后还能换回原始位图吗？
'''
translate = '''
### Why does a clean detail in the SVG disappear after slicing?
'''

[[block]]
key = "0da71563fa109dd5"
type = "paragraph"
origin = '''
可以随时重新上传此前备份的原始位图。由于矢量化是有损重绘过程，无法从生成的 SVG 反向还原原图的全部像素与纹理。
'''
translate = '''
A vector shape can be mathematically sharp yet narrower than your nozzle's minimum line width at the target print dimensions. Always check fine details in your slicer's Layer Preview.
'''

[[block]]
key = "268f9e40a20d6c50"
type = "heading"
origin = '''
### SVG 导入图像转换后出现白底、破洞或局部缺失怎么办？
'''
translate = '''
### Should I trace pixel art into SVG?
'''

[[block]]
key = "9aaaebb662bd3c74"
type = "paragraph"
origin = '''
先核对“图像转矢量”页面的 SVG 预览是否正常；若预览正常而转换页面异常，可按[SVG 上传失败、白底、破洞和细节异常怎么排查？](pathname:///zh/docs/knowledge/svg-troubleshooting/)逐项检查画布边界、路径闭合、蒙版与滤镜。
'''
translate = '''
Keep pixel art as a bitmap and select **Pixel Art** mode instead—it preserves crisp grid cells directly without rounding or merging corners. See [Choose High-Fidelity, Pixel Art, or Vector Mode](pathname:///en/docs/knowledge/image-mode-selection/).
'''
