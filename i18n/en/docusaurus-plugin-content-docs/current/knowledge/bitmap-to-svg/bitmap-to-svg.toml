[[block]]
key = "ea441903b0a41969"
type = "paragraph"
origin = '''
默认状态下，颜色数量设为自动判断，平滑度处于中间档位，统一细节控制保持关闭。先跑一次默认结果作为对照基准，更容易看清后续需要针对哪一处微调。
'''
translate = '''
Start with a baseline pass:

1. Leave **Color Count** set to **Auto**;
2. Keep **Smoothness** and **Detail Level** at their default values;
3. Click **Start Vectorization** and wait for the preview to finish.
'''

[[block]]
key = "a1345c8661b971e3"
type = "heading"
origin = '''
## 第二步：了解三个基础参数
'''
translate = '''
'''

[[block]]
key = "51439da571c0a0d6"
type = "table"
origin = '''
| 参数 | 作用 | 何时调整 |
| --- | --- | --- |
| 颜色数量 | 控制允许保留或归并的颜色类别数 | 自动结果出现过多相近杂色，或图案本身只有固定几种颜色时，切换为手动指定 |
| 平滑度 | 控制路径抽稀与边缘平滑程度 | 轮廓锯齿明显时逐步调高；小字、尖角或细线开始钝化消失时适当回调 |
| 细节等级 | 启用后用单个滑块联动多项细节阈值 | 想在不逐项展开高级参数的情况下，快速对比“更简练”与“保留更多细节”两档效果时开启 |
'''
translate = '''
'''

[[block]]
key = "12a56ad374d1b376"
type = "paragraph"
origin = '''
这里的“颜色数量”指 SVG 归纳出的色块类别数，而非打印所需的真实耗材卷数。进入“图像转换”后，软件会结合所选的经典 LUT 或耗材档案重新计算叠色方案。调整时以关键轮廓和文字清晰度为准即可，无需追求过高的颜色数或形状数。
'''
translate = '''
Running defaults first gives you a clear reference point before adjusting individual sliders.
'''

[[block]]
