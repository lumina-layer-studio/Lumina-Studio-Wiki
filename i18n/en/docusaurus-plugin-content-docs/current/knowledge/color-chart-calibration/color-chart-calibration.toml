[[block]]
key = "071ff99a84414529"
type = "heading"
origin = '''
# 校准板校色
'''
translate = '''
# Color-Chart Calibration
'''

[[block]]
key = "9dabcfb4ad5a0d47"
type = "paragraph"
origin = '''
如果在预览时发现明显色偏（例如肤色发绿、中性灰偏绿），通常是因为生成 LUT 时上传的校准板照片未经标准校色。
'''
translate = '''
'''

[[block]]
key = "aca00213f3cbcdf4"
type = "paragraph"
origin = '''
本文介绍结合 24 色卡、Camera Raw 与 Photoshop 的进阶校准板校色流程，帮助你制作高精度的自定义 LUT。项目开发组已对部分常见品牌耗材完成了官方校准并标注，日常使用建议优先直接选用已校准数据。
'''
translate = '''
'''

