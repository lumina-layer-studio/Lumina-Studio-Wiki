## 拍摄环境要求
'''
translate = '''
'''

[[block]]
key = "b6eb92e88e6991f8"
type = "list"
composite = true
origin = '''
{{b6eb92e88e6991f8-ee8b61cca275c936}}
{{b6eb92e88e6991f8-49f9c7924dad341f}}
{{b6eb92e88e6991f8-d323b6197ad00ba6}}
'''
