[[block]]
key = "b6eb92e88e6991f8-ee8b61cca275c936"
type = "listItem"
composite = true
origin = '''
1. {{b6eb92e88e6991f8-ee8b61cca275c936-ac5247e13909da2f}}
'''
translate = '''
'''

[[block]]
key = "b6eb92e88e6991f8-ee8b61cca275c936-ac5247e13909da2f"
type = "paragraph"
origin = '''
选择晴天户外无阴影遮挡的位置拍摄；周围避免紧邻大面积高饱和纯色物体（比如一棵绿树或彩色墙面），防止环境反光污染校准板与色卡；
'''
translate = '''
'''

[[block]]
key = "b6eb92e88e6991f8-49f9c7924dad341f"
type = "listItem"
composite = true
origin = '''
2. {{b6eb92e88e6991f8-49f9c7924dad341f-21d794b4091f5664}}
'''
translate = '''
'''

[[block]]
key = "b6eb92e88e6991f8-49f9c7924dad341f-21d794b4091f5664"
type = "paragraph"
origin = '''
观察光照角度，确保阳光照射在校准板上不会拉出凸显打印层纹的阴影或刺眼高光点，如有反光可微调摆放角度；
'''
translate = '''
'''

[[block]]
key = "b6eb92e88e6991f8-d323b6197ad00ba6"
type = "listItem"
composite = true
origin = '''
3. {{b6eb92e88e6991f8-d323b6197ad00ba6-a99b7de38856bbeb}}
'''
translate = '''
'''

[[block]]
key = "b6eb92e88e6991f8-d323b6197ad00ba6-a99b7de38856bbeb"
type = "paragraph"
origin = '''
避开日出、日落前后的低色温时段。
'''
translate = '''
'''

[[block]]
key = "f69248798af6ee89"
type = "admonition"
composite = true
origin = '''
:::tip[关于人造光源]
{{f69248798af6ee89-ab02db712d61ec93}}
:::
'''
translate = '''
'''

[[block]]
key = "f69248798af6ee89-ab02db712d61ec93"
type = "paragraph"
origin = '''
光源显色性直接决定校色精度。若使用高显色指数（Ra > 95）的专业摄影灯，且布光后校准板四角与中心五点的照度均匀度高于 90%，可替代晴天自然光；否则建议优先在晴天日光下拍摄。
'''
translate = '''
'''

