origin = '''
---
title: "0.2 和 0.4 喷嘴相当于多少分辨率？"
description: "用线宽、成品尺寸和 60 mm 实拍对比，理解 0.2 与 0.4 喷嘴打印平面彩色作品时的等效分辨率。"
sidebar_position: 20
---
'''
translate = '''
---
title: "What Image Resolution Do 0.2 and 0.4 mm Nozzles Provide?"
description: "Use line width, finished size, and a real 60 mm comparison to understand the equivalent resolution of flat color prints made with 0.2 and 0.4 mm nozzles."
sidebar_position: 20
---
'''

[[block]]
key = "60a4ab8a9bfbbbe2"
type = "paragraph"
origin = '''
按 Bambu Studio 默认线宽换算：**0.4 mm 喷嘴约相当于 60 PPI**，**0.2 mm 喷嘴约相当于 115 PPI**。
'''
translate = '''
Using standard Bambu Studio default line widths, a **0.4 mm nozzle provides roughly 60 PPI**, and a **0.2 mm nozzle provides roughly 115 PPI**.
'''

[[block]]
key = "9159027cada91a68"
type = "paragraph"
origin = '''
FDM 3D 打印通过喷嘴挤出具有一定物理宽度的塑料走线，决定平面细节上限的核心参数是切片软件中的**线宽**。把单条参考线宽看作一个采样间隔，就能直观估算不同尺寸作品所能呈现的细节密度。
'''
translate = '''
Because an FDM printer extrudes continuous plastic toolpaths with real physical width, the slicer's **line width** determines how much flat detail fits into a given print size. Treating one reference line width as one sampling interval gives you a practical way to estimate detail capacity before printing.
'''

[[block]]
key = "ad63aafe1bc72f7d"
type = "admonition"
composite = true
origin = '''
:::tip[核心结论]
{{ad63aafe1bc72f7d-4a373ef8c9c8d135}}
:::
'''
translate = '''
:::tip[Key takeaway]
{{ad63aafe1bc72f7d-4a373ef8c9c8d135}}
:::
'''

[[block]]
key = "ad63aafe1bc72f7d-4a373ef8c9c8d135"
type = "paragraph"
origin = '''
相同尺寸下，0.2 mm 喷嘴在单边方向能排下接近两倍数量的细线，人物五官、细小文字、衣物纹理和独立小色块更容易清晰分离。
'''
translate = '''
At the same physical dimensions, a 0.2 mm nozzle fits nearly twice as many lines across each edge—giving facial features, small text, fine textures, and isolated color patches far more room to stay distinct.
'''

