[[block]]
key = "25513bb9163e2481"
type = "paragraph"
origin = '''
按 0.42 mm 与 0.22 mm 参考线宽估算单边采样数：
'''
translate = '''
Estimating reference line counts across a 60 mm span:
'''

[[block]]
key = "11a4e64d5d1dab35"
type = "code"
origin = '''
```text
0.4 喷嘴：60 / 0.42 ≈ 143
0.2 喷嘴：60 / 0.22 ≈ 273
```
'''
translate = '''
```text
0.4 mm nozzle: 60 / 0.42 ≈ 143
0.2 mm nozzle: 60 / 0.22 ≈ 273
```
'''

[[block]]
key = "4dbbe10a16a5b7d4"
type = "paragraph"
origin = '''
同样在 60 mm 长度内，0.4 mm 喷嘴约可容纳 143 条参考线宽，0.2 mm 喷嘴约可容纳 273 条。观察人物的眼睛与嘴巴、衣服细条纹、手脚边缘及微小独立色块：右侧 0.2 mm 版本保留了更多细线，相邻小色块分界清晰；左侧 0.4 mm 版本主体结构完整，但更细微的局部已合并或变粗。此外，耗材状态、流量、首层挤压程度与打印板纹理也会共同影响实物的表面细节。
'''
translate = '''
Across the same 60 mm width, the 0.4 mm setup fits about 143 reference line widths, whereas the 0.2 mm setup fits about 273. Notice the eyes and mouth, thin stripes on the clothing, outlines around the hands and feet, and tiny standalone color patches: the 0.2 mm print keeps fine strokes separated, while the 0.4 mm print captures the main silhouette clearly with finer strokes merged or thickened. Filament condition, flow calibration, first-layer squish, and build-plate texture also shape the final look.
'''

