key = "c63ed887de896ad3-8c850d26ebe562ae-3203f1758f764050"
type = "paragraph"
origin = '''
**喷嘴直径**：喷嘴孔径规格与硬件预设基准，如 0.2 mm、0.4 mm。
'''
translate = '''
**Nozzle diameter**: the physical orifice size and hardware preset baseline (`0.2 mm`, `0.4 mm`).
'''

[[block]]
key = "c63ed887de896ad3-0b22bf560ac2406c"
type = "listItem"
composite = true
origin = '''
- {{c63ed887de896ad3-0b22bf560ac2406c-aa13f1f05563f0f6}}
'''
translate = '''
- {{c63ed887de896ad3-0b22bf560ac2406c-aa13f1f05563f0f6}}
'''

[[block]]
key = "c63ed887de896ad3-0b22bf560ac2406c-aa13f1f05563f0f6"
type = "paragraph"
origin = '''
**线宽**：熔融耗材挤出后压合在打印板或下层表面形成的目标宽度。
'''
translate = '''
**Line width**: the target width of extruded plastic pressed onto the build plate or underlying layer.
'''

[[block]]
key = "c63ed887de896ad3-f818ad75d96546cf"
type = "listItem"
composite = true
origin = '''
- {{c63ed887de896ad3-f818ad75d96546cf-3ef7af67aafa83b0}}
'''
translate = '''
- {{c63ed887de896ad3-f818ad75d96546cf-3ef7af67aafa83b0}}
'''

[[block]]
key = "c63ed887de896ad3-f818ad75d96546cf-3ef7af67aafa83b0"
type = "paragraph"
origin = '''
**等效像素**：将一条参考线宽近似视作一个平面采样位置，便于换算对比。
'''
translate = '''
**Equivalent pixel**: a practical approximation that treats one reference line width as one planar sample.
'''

[[block]]
key = "6bcc438d47609e7c"
type = "paragraph"
origin = '''
在 Bambu Studio 常用默认工艺配置中，0.4 mm 喷嘴默认线宽为 `0.42 mm`，0.2 mm 喷嘴默认线宽为 `0.22 mm`。切片软件还会分别为外墙、内墙、首层、顶面和填充指定线宽；启用 Arachne 可变线宽墙生成器时，局部线宽更会随几何窄缝动态缩放。因此，用切片预设中的参考线宽估算，比直接套用喷嘴孔径更贴近实际走线。
'''
translate = '''
In standard Bambu Studio presets, a 0.4 mm nozzle defaults to a `0.42 mm` line width and a 0.2 mm nozzle defaults to `0.22 mm`. Slicers also assign separate widths to outer walls, inner walls, first layers, top surfaces, and infill—and with the Arachne variable-width wall generator, local widths adapt dynamically to narrow features. Using your preset's reference line width gives a closer estimate than dividing by the nominal orifice size.
'''

[[block]]
key = "30fcbe5f1da7ee49"
type = "admonition"
composite = true
origin = '''
:::note[查看实际线宽]
{{30fcbe5f1da7ee49-67b58fe3ff2afbc1}}
:::
'''
translate = '''
:::note[Use actual line width]
{{30fcbe5f1da7ee49-67b58fe3ff2afbc1}}
:::
'''

[[block]]
key = "30fcbe5f1da7ee49-67b58fe3ff2afbc1"
type = "paragraph"
origin = '''
0.2 mm 喷嘴并不代表单根线条宽度严格等于 0.2 mm。若你在切片预设中手动调整过线宽，请代入修改后的实际线宽计算。
'''
translate = '''
A 0.2 mm nozzle profile does not extrude lines that are literally 0.20 mm wide by default. If you customize line widths in your slicer preset, substitute your configured line width into the formulas below.
'''

[[block]]
key = "b6d5a35b3597822f"
type = "heading"
origin = '''
## 如何换算自己作品的等效分辨率？
'''
translate = '''
## Calculating equivalent resolution for your print
'''

[[block]]
key = "04267724231ed739"
type = "paragraph"
origin = '''
已知成品边长与切片线宽，即可估算该边方向可容纳的参考采样数：
'''
translate = '''
Divide any finished edge length by your slicer's line width to estimate how many reference samples fit along that edge:
'''

[[block]]
key = "32cd3a33180a3240"
type = "code"
origin = '''
```text
某一边的等效像素数量 ≈ 成品该边尺寸（mm）÷ 实际线宽（mm）
```
'''
translate = '''
```text
Equivalent samples on one side ≈ side length (mm) / actual line width (mm)
```
'''

[[block]]
key = "2ff1884a57e8474b"
type = "paragraph"
origin = '''
以高度 100 mm 的作品为例：
'''
translate = '''
For a 100 mm tall print:
'''

[[block]]
key = "f184e2a7f9dfef85"
type = "code"
origin = '''
```text
0.4 喷嘴：100 ÷ 0.42 ≈ 238
0.2 喷嘴：100 ÷ 0.22 ≈ 455
```
'''
translate = '''
```text
0.4 mm nozzle: 100 / 0.42 ≈ 238
0.2 mm nozzle: 100 / 0.22 ≈ 455
```
'''

[[block]]
key = "0b3583dfaa037ced"
type = "paragraph"
origin = '''
即高度方向分别约有 238 个或 455 个参考采样位置；若宽度为 80 mm，再用 `80 ÷ 实际线宽` 即可算出横向采样数。
'''
translate = '''
That gives roughly 238 or 455 reference samples vertically; for an 80 mm width, divide `80` by the same line width to find the horizontal count.
'''

[[block]]
key = "89fd3a98b3fc5cf2"
type = "paragraph"
origin = '''
折算为每英寸等效像素（PPI）：
'''
translate = '''
To convert directly into equivalent pixels per inch (PPI):
'''

[[block]]
key = "b427a46d6a3f9b3a"
type = "code"
origin = '''
```text
等效 PPI ≈ 25.4 ÷ 实际线宽（mm）

0.4 喷嘴：25.4 ÷ 0.42 ≈ 60 PPI
0.2 喷嘴：25.4 ÷ 0.22 ≈ 115 PPI
```
'''
translate = '''
```text
Equivalent PPI ≈ 25.4 / actual line width (mm)

0.4 mm nozzle: 25.4 / 0.42 ≈ 60 PPI
0.2 mm nozzle: 25.4 / 0.22 ≈ 115 PPI
```
'''

[[block]]
key = "e86db5cf378ae5d2"
type = "paragraph"
origin = '''
从 0.4 mm 换用 0.2 mm 喷嘴，单边参考采样数接近翻倍，二维平面的理论采样密度约为原来的 3.6 倍；具体到肉眼清晰度，还会受走线规划、色块对比与耗材流动性共同决定。
'''
translate = '''
Switching from 0.4 mm to 0.2 mm nearly doubles linear sample density along each axis—roughly `3.6×` across two dimensions—while actual visual sharpness also depends on toolpath routing, color contrast, and extrusion behavior.
'''

[[block]]
key = "3339553201b00f8d"
type = "heading"
origin = '''
## 60、100、150、200 mm 常见尺寸对照
'''
translate = '''
## What 60, 100, 150, and 200 mm look like in practice
'''

[[block]]
key = "81c2c36a2f3aae2f"
type = "table"
origin = '''
| 成品某一边尺寸 | 0.4 喷嘴（0.42 mm 线宽） | 0.2 喷嘴（0.22 mm 线宽） | 直观类比 |
| ---: | ---: | ---: | --- |
| 60 mm | 约 143 | 约 273 | 小型冰箱贴：单边采样约 144p 对 270p |
| 100 mm | 约 238 | 约 455 | 手掌 / 杯垫大小：单边采样约 240p 对接近 480p |
| 150 mm | 约 357 | 约 682 | 明信片高度：单边采样约 360p 对接近 720p |
| 200 mm | 约 476 | 约 909 | 接近 A4 短边：单边采样约 480p 对 900p |
'''
translate = '''
| Side length | 0.4 mm nozzle (0.42 mm width) | 0.2 mm nozzle (0.22 mm width) | Practical scale |
| ---: | ---: | ---: | --- |
| 60 mm | about 143 | about 273 | Small fridge magnet: ~144p vs. ~270p along one edge |
| 100 mm | about 238 | about 455 | Coaster / palm-sized piece: ~240p vs. ~480p |
| 150 mm | about 357 | about 682 | Postcard height: ~360p vs. ~720p |
| 200 mm | about 476 | about 909 | Short edge of A4 paper: ~480p vs. ~900p |
'''

[[block]]
