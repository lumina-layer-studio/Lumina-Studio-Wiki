'''

[[block]]
key = "b85d263b2790b500"
type = "admonition"
composite = true
origin = '''
:::warning[必看]

{{b85d263b2790b500-4c37ecd78e159ac3}}

{{b85d263b2790b500-75e6bbddcdaa508e}}

:::
'''
translate = '''
'''

[[block]]
key = "b85d263b2790b500-4c37ecd78e159ac3"
type = "paragraph"
origin = '''
选择耗材时只需颜色相近即可，不必寻找 HEX 色值完全一致的线材。例如：绿色可选深绿或浅绿，红色可选深红或普通红，蓝色可选深蓝或浅蓝，黄色可选淡黄或荧光黄，白色可选奶白或普通白，青色也可用青色、蓝色或薄荷色等相近颜色替代。
'''
translate = '''
'''

[[block]]
key = "b85d263b2790b500-75e6bbddcdaa508e"
type = "paragraph"
origin = '''
关键在于从色卡校准到正式打印，始终保持软件中的颜色对象与实际装入的耗材一一对应。
'''
translate = '''
'''

