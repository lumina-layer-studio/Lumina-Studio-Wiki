[[block]]
key = "c7fdecf406937bdb"
type = "heading"
origin = '''
# 耗材使用
'''
translate = '''
# Filament Selection
'''

[[block]]
key = "37a1b62c91485dbf"
type = "paragraph"
origin = '''
Lumina 经典流程支持 2 色、4 色、6 色和 8 色四种固定配色模式。熟悉色卡与校准原理后，也可以自行替换对应通道的颜色；本篇主要介绍标准配色搭配与色卡识别方法。
'''
translate = '''
'''

[[block]]
key = "62e86f73619d32d5"
type = "paragraph"
origin = '''
下图为各模式的标准颜色搭配参考：
'''
translate = '''
'''

[[block]]
key = "0043787421e0e953"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/468.png').default}
  alt="468.png"
/>
'''
translate = '''
'''

[[block]]
key = "a5315f33781de194"
type = "paragraph"
origin = '''
实物线盘搭配示例：
'''
translate = '''
'''

[[block]]
key = "b8695143e43669af"
type = "mdxJsxFlowElement"
origin = '''
<img
  src={require('./assets/se8.jpg').default}
  alt="se8.jpg"
/>
'''
