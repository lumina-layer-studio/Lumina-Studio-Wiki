## 修改扩展名不会转换图像格式
'''
translate = '''
## File Extensions vs. Actual Contents
'''

[[block]]
key = "c933f8943adba5bb"
type = "paragraph"
origin = '''
直接把 `picture.png` 重命名为 `picture.svg` 并不会把像素变成路径，反而会导致软件因文件头与扩展名不符而报错。以下两种容器封装情形也值得留意：
'''
translate = '''
Simply renaming `picture.png` to `picture.svg` leaves the pixel data untouched and will cause most apps to reject the file. Watch out for two common container pitfalls as well:
'''

[[block]]
key = "d956c538bb1d4920"
type = "list"
composite = true
origin = '''
{{d956c538bb1d4920-0d900423219aa34a}}
