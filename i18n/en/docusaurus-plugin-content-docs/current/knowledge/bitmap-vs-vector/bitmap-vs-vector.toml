[[block]]
key = "46f7202e00bcff19"
type = "heading"
origin = '''
# 位图与矢量图有什么区别？
'''
translate = '''
# Bitmap vs. Vector Images: What’s the Difference?
'''

[[block]]
key = "e8671a244e1f5240"
type = "paragraph"
origin = '''
数字图像主要分为两类记录方式：
'''
translate = '''
Digital images store visual information in two main ways:
'''

[[block]]
key = "dc61dce05c345f04"
type = "list"
composite = true
origin = '''
{{dc61dce05c345f04-71e69b00937f7e4f}}
{{dc61dce05c345f04-bb961cd476089b62}}
'''
translate = '''
{{dc61dce05c345f04-71e69b00937f7e4f}}
{{dc61dce05c345f04-bb961cd476089b62}}
'''

[[block]]
key = "dc61dce05c345f04-71e69b00937f7e4f"
type = "listItem"
composite = true
origin = '''
- {{dc61dce05c345f04-71e69b00937f7e4f-e8ff30befde3bc3f}}
'''
translate = '''
- {{dc61dce05c345f04-71e69b00937f7e4f-e8ff30befde3bc3f}}
'''

[[block]]
key = "dc61dce05c345f04-71e69b00937f7e4f-e8ff30befde3bc3f"
type = "paragraph"
origin = '''
**位图（光栅图）**：由固定数量的像素网格组成，每个像素单独记录自己的颜色值。
'''
translate = '''
A **bitmap** (or raster image) stores a fixed grid of pixels, with each pixel holding its own color value.
'''

[[block]]
key = "dc61dce05c345f04-bb961cd476089b62"
type = "listItem"
composite = true
origin = '''
- {{dc61dce05c345f04-bb961cd476089b62-4e9848c5863bdf01}}
'''
translate = '''
- {{dc61dce05c345f04-bb961cd476089b62-4e9848c5863bdf01}}
'''

[[block]]
key = "dc61dce05c345f04-bb961cd476089b62-4e9848c5863bdf01"
type = "paragraph"
origin = '''
**矢量图**：记录点、直线、贝塞尔曲线、轮廓与填充规则，打开或缩放时按数学公式实时绘制图形。
'''
translate = '''
A **vector image** stores points, lines, curves, outlines, and fills, redrawing shapes mathematically at any size.
'''

[[block]]
key = "e9bbfd4be7191550"
type = "paragraph"
origin = '''
两种格式各有所长：照片、柔和渐变与数字绘画适合用位图表现细腻层次；Logo、图标、文字轮廓、线稿与平涂色块图形则适合用矢量路径保持利落边缘。根据素材本身的特点来选择格式，效果最稳定。
'''
translate = '''
Each format excels at different kinds of artwork. Photographs, soft gradients, and digital paintings fit bitmap images naturally. Logos, icons, outlined text, line art, and flat-color graphics fit vector paths. Choosing the format that matches your original artwork gives you the cleanest result in Lumina Studio.
'''

[[block]]
key = "b52fbee3ff960c16"
type = "admonition"
composite = true
origin = '''
:::info[直观理解]
{{b52fbee3ff960c16-359136306eebdb48}}
:::
'''
translate = '''
:::info[Quick Analogy]
{{b52fbee3ff960c16-359136306eebdb48}}
:::
'''

[[block]]
key = "b52fbee3ff960c16-359136306eebdb48"
type = "paragraph"
origin = '''
位图就像一张填满色块的方格纸；矢量图则像一份写明“起点坐标、曲线弧度与填充颜色”的制图说明。
'''
translate = '''
Think of a bitmap as graph paper with every square already colored in, and a vector image as a set of drawing instructions that defines where points sit, how curves bend, and which regions are filled.
'''

[[block]]
key = "c0c08b93a9a13ce0"
type = "heading"
origin = '''
