[[block]]
key = "7cbe73fbe7226fda-e5f5d8f4f416892d-11584af379ced583"
type = "paragraph"
origin = '''
**左侧（位图）**：像素总数固定，超出原始分辨率放大后会出现锯齿状像素格。
'''
translate = '''
**Left (Bitmap)**: Because the pixel count is fixed, zooming in exposes individual square pixels.
'''

[[block]]
key = "7cbe73fbe7226fda-1631e3f8c66166e5"
type = "listItem"
composite = true
origin = '''
- {{7cbe73fbe7226fda-1631e3f8c66166e5-c02f8dfb6444e0de}}
'''
translate = '''
- {{7cbe73fbe7226fda-1631e3f8c66166e5-c02f8dfb6444e0de}}
'''

[[block]]
key = "7cbe73fbe7226fda-1631e3f8c66166e5-c02f8dfb6444e0de"
type = "paragraph"
origin = '''
**右侧（矢量图）**：软件根据路径方程按新尺寸重新计算边缘，曲线和斜线依然平滑。
'''
translate = '''
**Right (Vector)**: The software recalculates the paths at the larger size, keeping curves and diagonal edges crisp.
'''

[[block]]
key = "a40d9ed3763835c8"
type = "paragraph"
origin = '''
显示器最终仍通过物理像素呈现画面，矢量图的优势在于源文件保存的是几何描述，放大时可重新计算清晰边界，而不是单纯拉伸原有像素。
'''
translate = '''
Monitors still render both formats using physical screen pixels, of course—the key difference is that a vector file recalculates clean geometry whenever you resize it instead of stretching a fixed pixel grid.
'''

[[block]]
key = "2b277e3d224cbad1"
type = "heading"
origin = '''
## 位图与矢量图速查表
'''
translate = '''
## Quick Comparison
'''

[[block]]
key = "019dc1053e6fef30"
type = "table"
origin = '''
| 对比维度 | 位图 | 矢量图 |
| --- | --- | --- |
| 记录的数据 | 固定网格中的像素颜色 | 点、线、曲线、闭合路径与填充 |
| 放大后的表现 | 超过原始分辨率后出现像素格或模糊 | 原生路径按目标尺寸平滑重绘 |
| 擅长表现的素材 | 照片、复杂光影、自然纹理、柔和渐变、数字绘画、像素画 | Logo、图标、转曲文字、线稿、平涂色块图形 |
| 常见文件扩展名 | JPG/JPEG、PNG、WebP、HEIC/HEIF、BMP、TIFF | SVG、AI、EPS |
| 常用编辑方式 | 画笔涂抹、选区裁切、像素级调色与修图 | 调整锚点、路径走向、描边宽度与填充色 |
| Lumina 推荐用法 | 直接导入原图，按画面特征选择高保真或像素模式 | 优先保留设计软件导出的原生 SVG 路径导入 |
'''
translate = '''
| Aspect | Bitmap | Vector |
| --- | --- | --- |
| Core data | Pixel colors in a fixed grid | Points, lines, curves, closed paths, and fills |
| Behavior when enlarged | Becomes blocky or soft past its native resolution | Redraws native paths smoothly at any scale |
| Best suited for | Photos, subtle lighting, textures, gradients, digital paintings, pixel art | Logos, icons, outlined text, line art, flat-color graphics |
| Common file extensions | JPG/JPEG, PNG, WebP, HEIC/HEIF, BMP, TIFF | SVG, AI, EPS |
| Typical editing tools | Brushes, selections, pixel retouching, and color grading | Node editing, path operations, strokes, and solid fills |
| Recommended Lumina workflow | Upload the original bitmap and choose High-Fidelity or Pixel Art mode | Keep native SVG paths intact and use Vector mode |
'''

[[block]]
key = "20eb3acaf211a499"
type = "paragraph"
origin = '''
文件扩展名只是外层格式标识。例如 PDF 与 SVG 标准都支持在同一个文件内混合存放矢量路径与嵌入位图，因此 `.svg` 文件里也可能包含未经矢量化处理的位图图层。
'''
translate = '''
File extensions are a helpful clue rather than a guarantee. Formats like PDF and SVG can hold both native vector paths and embedded raster images inside the same container, so a `.svg` filename can still wrap a flat bitmap image.
'''

