[[block]]
key = "7449bb6f5b473ada"
type = "heading"
origin = '''
### 修改了卡片的“显示颜色”，会影响打印出来的颜色吗？
'''
translate = '''
'''

[[block]]
key = "358ca4249b125053"
type = "paragraph"
origin = '''
不会。显示颜色仅用于耗材库内的色块识别与列表展示，图像转换时的叠色计算完全依据档案内部的光学拟合数据。如需更新测量结果，请重新拍摄梯度卡并执行“再次验证”。
'''
translate = '''
'''

[[block]]
key = "3c818a703530221f"
type = "heading"
origin = '''
### 拟合误差数字越小，代表打印成色一定越准吗？
'''
translate = '''
'''

[[block]]
key = "2edb8df50e0f28b0"
type = "paragraph"
origin = '''
拟合误差适合在同一套均匀布光与标准拍摄流程下辅助判断拟合优度。如果拍摄时存在局部炫光、曝光失准或色温偏离，单纯追求更小的误差数字并不能提升实物还原度。建议结合估算颜色、历史一致性与实物试打小样综合验证。
'''
translate = '''
'''

[[block]]
key = "8e3fbfa4ce6a61d7"
type = "heading"
origin = '''
### 为什么导入 ZIP 后出现了两张一模一样名字的卡片？
'''
translate = '''
### Why doesn't changing Display Color alter my printed colors?
'''

[[block]]
key = "968266b772708500"
type = "paragraph"
origin = '''
耗材名称与品牌属于可重复的显示标签。当导入包与本地已有目录发生命名冲突且内容不同时，系统会自动新建带后缀的独立目录妥善保留两份数据。比对目录名、验证次数和更新时间后，导出备份并删掉多余的一份即可。
'''
translate = '''
**Display Color** only sets the UI badge swatch in the Material Library. Color conversion relies on the archive's measured optical parameters—use **Re-Verify** and print a test swatch whenever physical color predictions need updating.
'''

[[block]]
key = "2cdd8f9d08a7fe43"
type = "heading"
origin = '''
### 可以把自己导出的耗材 ZIP 分享给朋友用吗？
'''
translate = '''
### Does a lower fit error guarantee a more accurate print?
'''

[[block]]
key = "715c220115b23d9e"
type = "paragraph"
origin = '''
可以正常导入。分享前请确认自己对包内的实测数据与相关内容拥有分享权限；接收方导入后，也需核对手头线材的品牌系列、批次与层高是否一致，并先打印小样确认匹配度。
'''
translate = '''
Fit error is a helpful comparison metric when lighting, camera exposure, and card alignment stay controlled. Specular glare, color casts, or mismatched cards can still skew real-world accuracy even when numerical error looks low, so always confirm with a physical swatch.
'''

[[block]]
key = "1da4cfd9f884b21c"
type = "heading"
origin = '''
### 一个耗材 ZIP 里最多能打包几份档案？
'''
translate = '''
### Is it safe to rename an archive?
'''

[[block]]
key = "e9595dfc01fed0ce"
type = "paragraph"
origin = '''
数量不限，导出时勾选几份就会把几份打进同一个 ZIP；导入时也支持一次多选多个 ZIP 批量导入。档案较多时，按品牌或材质分包导出并在文件名上标注日期会更便于日后检索。
'''
translate = '''
Yes. **Edit Details** updates the visible name and brand while keeping the internal directory ID unchanged. Avoid giving multiple distinct archives identical display names so they remain easy to tell apart in conversion pickers.
'''

[[block]]
key = "05b755b57cf794bb"
type = "heading"
origin = '''
### “耗材库”和“云端耗材”有什么区别？
'''
translate = '''
### Can I use a Material Archive shared by another maker right away?
'''

[[block]]
key = "473ebef0f84c3823"
type = "paragraph"
origin = '''
“耗材库”管理当前已安装到本地、可直接供图像转换调用的档案；“云端耗材”则用于在线浏览和下载官方或社区发布的档案包。编辑或删除带有“官方”标识的档案前，同样建议先导出备份，留意后续云端同步或版本更新的影响。
'''
translate = '''
Verify the exact filament brand, product line, finish, calibrated Layer Height, and sharing permissions first, then print a small validation swatch on your own setup before committing to a full-size artwork.
'''

[[block]]
key = "9945e0622b94c037"
type = "heading"
origin = '''
### 在多份档案之间挑选时要注意什么？
'''
translate = '''
### What should I check before deleting a duplicate archive?
'''

[[block]]
key = "2cd3808f7a29138f"
type = "paragraph"
origin = '''
请结合材质、品牌系列、色号、批次与目标层高综合挑选，详细判断方法见[耗材档案和经典 LUT 怎么选？](../material-profile-selection/material-profile-selection.mdx)。
'''
translate = '''
Export a backup ZIP first, compare directory IDs, timestamps, and verification histories between the two cards, and make sure no active project relies on the copy you plan to remove.
'''

[[block]]
key = "44e32d2a8aaaed45"
type = "heading"
origin = '''
### 建好耗材档案后，怎样提前测试不同颜色的叠层效果？
'''
translate = '''
### Why did an imported archive land under a different brand group?
'''

[[block]]
key = "86fe40490fd7b14e"
type = "paragraph"
origin = '''
可前往“耗材管理 → 配方查询”，按从观赏面到底板的顺序自由排列档案、实时查看预测颜色，并将多组候选配方一键导出为验证色块 3MF 试打确认。操作步骤详见[组合耗材层、预测叠色并生成验证色块](pathname:///zh/docs/knowledge/material-recipe-query/)。
'''
translate = '''
Brand grouping reads the brand string stored inside the archive's metadata. Open **Edit Details** and update the **Brand** field to move it into your preferred brand group without touching its calibration data.
'''
