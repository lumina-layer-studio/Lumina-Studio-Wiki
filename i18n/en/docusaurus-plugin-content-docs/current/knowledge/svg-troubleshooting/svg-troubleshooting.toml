## Symptom 5: Traced bitmaps still look jagged
'''

[[block]]
key = "1a4d408ec0d16966"
type = "paragraph"
origin = '''
位图转矢量的自动描摹算法会忠实拟合原图像素边界：
'''
translate = '''
Auto-tracing converts existing pixel edges into vector curves—including any flaws in the source raster:
'''

[[block]]
key = "23ba2551bc2bbad9"
type = "list"
composite = true
origin = '''
{{23ba2551bc2bbad9-be3010f92f4d0e68}}
