[[block]]
key = "bdf6aef19f089500"
type = "paragraph"
origin = '''
先区分两种不同成因的“白底”：
'''
translate = '''
Distinguish between physical print backing and an actual white shape inside the SVG:
'''

[[block]]
key = "93e5ec014a930f29"
type = "heading"
origin = '''
### 情况 A：Lumina 生成的实体支撑底板
'''
translate = '''
### Case A: Physical backing generated by Lumina
'''

[[block]]
key = "590431bec9688940"
type = "paragraph"
origin = '''
SVG 的透明画布代表背景无填充色；为了把画面中互不相连的色块托举成一件可整体取下的打印件，Lumina 会按当前设置生成实体底板。
'''
translate = '''
A transparent SVG canvas has no background color on screen, whereas disconnected islands in a 3D print still need a solid base plate to hold them together as one piece.
'''

[[block]]
key = "f7bee6eb8f7e0b0a"
type = "list"
composite = true
origin = '''
{{f7bee6eb8f7e0b0a-12e3ffbb2b64fb8b}}
{{f7bee6eb8f7e0b0a-171b0a759611ebc4}}
'''
translate = '''
- To change the backing color, select another filament under **Base Plate Material**.
- To manage or separate the backing object independently in your slicer, enable **Separate Backing** in advanced settings.
'''

[[block]]
key = "f7bee6eb8f7e0b0a-12e3ffbb2b64fb8b"
type = "listItem"
composite = true
origin = '''
- {{f7bee6eb8f7e0b0a-12e3ffbb2b64fb8b-af178674bab5d5b5}}
'''
