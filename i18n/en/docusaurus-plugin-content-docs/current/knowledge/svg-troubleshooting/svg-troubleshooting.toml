## Symptom 3: Holes, broken lines, overlaps, or self-intersections
'''

[[block]]
key = "66396f451b0b25f5"
type = "paragraph"
origin = '''
屏幕上看似相连的线条，在几何层面可能并未闭合：
'''
translate = '''
Shapes that look continuous on screen can still contain open endpoints or self-crossing segments:
'''

[[block]]
key = "c953f9e3b6006e69"
type = "heading"
origin = '''
### 断线或色块缺失
'''
translate = '''
### Missing regions or broken lines
'''

[[block]]
key = "d5db117209598eff"
type = "list"
composite = true
origin = '''
{{d5db117209598eff-d78a11fcb30b9461}}
{{d5db117209598eff-0607b43ee72da682}}
{{d5db117209598eff-69f350fff3a6cbb6}}
{{d5db117209598eff-4a7651bfe2ed39cb}}
'''
translate = '''
- Close every open path intended to print as a solid region.
- Convert stroke-only linework using **Stroke to Path** or **Expand Stroke**.
- Keep thin strokes wide enough at your target print size to exceed the nozzle's extrusion line width.
- Confirm no shapes sit outside the `viewBox` or an active clipping mask.
'''

[[block]]
key = "d5db117209598eff-d78a11fcb30b9461"
type = "listItem"
composite = true
origin = '''
- {{d5db117209598eff-d78a11fcb30b9461-533816507970522d}}
'''
translate = '''
'''

[[block]]
key = "d5db117209598eff-d78a11fcb30b9461-533816507970522d"
type = "paragraph"
origin = '''
