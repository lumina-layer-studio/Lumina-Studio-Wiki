## 稳定建模的 SVG 基准条件
'''
translate = '''
## Clean SVG baseline for 3D modeling
'''

[[block]]
key = "37244e4a1a8ab7da"
type = "paragraph"
origin = '''
排查或准备用于 3D 打印的 SVG 时，建议满足以下特征：
'''
translate = '''
For predictable results, prepare SVGs with the following structure:
'''

[[block]]
key = "18c7f471080714db"
type = "list"
composite = true
origin = '''
{{18c7f471080714db-e9d4c1a0db59f888}}
{{18c7f471080714db-3be033973f960690}}
